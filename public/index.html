async function sendMessage() {

if (isSending) {  
    return;  
}  


const text =  
    elements.messageInput  
        .value  
        .trim();  


if (!text && !attachedImage && !attachedFile) {  

    return;  
}  


const chat =  
    ensureChat();  


const userMessage = {  

    id:  
        makeId(),  

    role:  
        "user",  

    content:  
        text ||  
        (  
            currentMode ===  
            "image"  

                ? "Buat gambar berdasarkan gambar yang saya kirim."
                : attachedFile && attachedFile.textContent
                    ? `Baca file ${attachedFile.name}.`
                    : "Jelaskan gambar ini."  
        ),  

    time:  
        Date.now()  
};  


if (attachedImage) {
    userMessage.image = { mimeType: attachedImage.mimeType, data: attachedImage.data };
}

if (attachedFile) {
    userMessage.file = {
        name: attachedFile.name,
        mimeType: attachedFile.mimeType,
        size: attachedFile.size,
        data: attachedFile.data
    };
    if (attachedFile.textContent) {
        userMessage.content = `${text || "Baca file yang saya kirim."}\n\n--- FILE: ${attachedFile.name} ---\n${attachedFile.textContent}`;
    }
}  


chat.messages.push(  
    userMessage  
);  


if (  
    chat.title ===  
    "Chat baru"  
) {  

    chat.title =  
        text  

            ? text.slice(  
                0,  
                42  
            )  

            : "Percakapan gambar";  
}  


chat.updatedAt =  
    Date.now();  


saveChats();  

renderHistory();  


elements.welcome.style.display =  
    "none";  


renderMessage(  
    userMessage  
);  


const requestImage =  
    attachedImage  

        ? {  

            mimeType:  
                attachedImage.mimeType,  

            data:  
                attachedImage.data  

        }  

        : null;  


const requestFile =  
    attachedFile  

        ? {  

            name:  
                attachedFile.name,  

            mimeType:  
                attachedFile.mimeType,  

            size:  
                attachedFile.size,  

            data:  
                attachedFile.data  

        }  

        : null;  


const requestMode =  
    currentMode;  


elements.messageInput.value =  
    "";  


autoResize();  


resetAttachment();  


setSending(  
    true  
);  


try {  

    /*  
     * Kirim history percakapan  
     * + system prompt.  
     */  
    const messagesWithSystem = [  

        {  
            role:  
                "system",  

            content:  
                CREATOR_SYSTEM_PROMPT  
        },  

        ...chat.messages.map(  
            item => ({  

                role:  
                    item.role,  

                content:  
                    item.content  

            })  
        )  
    ];  


    const response =  
        await fetch(  
            "/api/chat",  
            {  

                method:  
                    "POST",  

                headers: {  

                    "Content-Type":  
                        "application/json"  
                },  

                body:  
                    JSON.stringify({  

                        messages:  
                            messagesWithSystem,  

                        image: requestImage,
                        file: requestFile,
                        mode: requestMode  

                    })  
            }  
        );  


    const raw =  
        await response.text();  


    let data;  


    try {  

        data =  
            JSON.parse(  
                raw  
            );  

    } catch {  

        throw new Error(  
            raw ||  
            `HTTP ${response.status}`  
        );  
    }  


    if (!response.ok) {  

        throw new Error(  
            data?.error ||  
            `HTTP ${response.status}`  
        );  
    }  


    /*  
     * Ambil sumber dari:  
     *  
     * data.sources  
     * data.references  
     * data.citations  
     * URL yang ada di data.reply  
     */  
    const sources =  
        extractSources(  
            data  
        );  


    const assistantMessage = {  

        id:  
            makeId(),  

        role:  
            "assistant",  

        content:  
            data.reply ||  
            "Tidak ada jawaban.",  

        model:  
            sanitizeModelName(  
                data.model  
            ),  

        sources:  
            sources,  

        time:  
            Date.now()  
    };  


    /*  
     * Jika backend mengirim  
     * gambar hasil generasi.  
     */  
    if (  
        data.image &&  
        data.image.data  
    ) {  

        assistantMessage.image = {  

            mimeType:  
                data.image.mimeType ||  
                "image/png",  

            data:  
                data.image.data  
        };  
    }  


    chat.messages.push(  
        assistantMessage  
    );  


    chat.updatedAt =  
        Date.now();  


    saveChats();  


    renderMessage(  
        assistantMessage  
    );

    setPinguState("idle");


    elements.modelLabel.textContent =  
        sanitizeModelName(  
            data.model  
        );  


    renderHistory();  


} catch (error) {  

    const errorMessage = {  

        id:  
            makeId(),  

        role:  
            "assistant",  

        content:  
            `Terjadi kesalahan:\n${  
                error?.message ||  
                "Unknown error"  
            }`,  

        model:  
            "Pingu AI",  

        sources:  
            [],  

        time:  
            Date.now()  
    };  


    chat.messages.push(  
        errorMessage  
    );  


    chat.updatedAt =  
        Date.now();  


    saveChats();  


    renderMessage(  
        errorMessage  
    );  


    renderHistory();  

} finally {  

    setSending(  
        false  
    );  
}

}

/* =========================================================
PINGU MOTION STATE
========================================================= */

function setPinguState(state) {

    const safeState =
        state === "writing" ||
        state === "thinking" ||
        state === "relaxed"
            ? state
            : "idle";

    document
        .querySelectorAll(".pingu-visual")
        .forEach(avatar => {

            avatar.classList.remove(
                "idle",
                "thinking",
                "writing"
            );

            avatar.classList.add(
                safeState
            );
        });
}

/* =========================================================
SEND STATE
========================================================= */

function setSending(
sending
) {

isSending =  
    sending;  


elements.sendButton.disabled =  
    sending;  


elements.typing  
    .classList  
    .toggle(  
        "show",  
        sending  
    );

setPinguState(
    sending
        ? "thinking"
        : "idle"
    );

if (sending) {  

    scrollBottom();  
}

}

/* =========================================================
TEXTAREA
========================================================= */

function autoResize() {

const textarea =  
    elements.messageInput;  


textarea.style.height =  
    "auto";  


textarea.style.height =  
    Math.min(  
        textarea.scrollHeight,  
        140  
    ) +  
    "px";

}

/* =========================================================
EVENTS
========================================================= */

elements.composer.addEventListener(
"submit",
event => {

event.preventDefault();  

    sendMessage();  
}

);

elements.messageInput.addEventListener(
"input",
() => {
    autoResize();
    if (!isSending) {
        setPinguState(
            elements.messageInput.value.trim()
                ? "writing"
                : "idle"
        );
    }
}
);

elements.messageInput.addEventListener(
"keydown",
event => {

if (  
        event.key ===  
            "Enter" &&  
        !event.shiftKey  
    ) {  

        event.preventDefault();  

        sendMessage();  
    }  
}

);

function closeAttachMenu() {
    if (elements.attachMenu) {
        elements.attachMenu.classList.remove("show");
    }
}

function openAttachMenu() {
    if (!elements.attachMenu) return;
    elements.attachMenu.classList.toggle("show");
}

elements.imageButton.addEventListener(
"click",
event => {
    event.stopPropagation();
    openAttachMenu();
}
);

if (elements.attachGallery) {
    elements.attachGallery.addEventListener("click", event => {
        event.stopPropagation();
        closeAttachMenu();
        if (elements.galleryInput) {
            elements.galleryInput.value = "";
            elements.galleryInput.click();
        }
    });
}

if (elements.attachFile) {
    elements.attachFile.addEventListener("click", event => {
        event.stopPropagation();
        closeAttachMenu();
        if (elements.fileInput) {
            elements.fileInput.value = "";
            elements.fileInput.click();
        }
    });
}

if (elements.galleryInput) {
    elements.galleryInput.addEventListener("change", () => {
        const file = elements.galleryInput.files?.[0];
        if (file) {
            handleFile(file);
        }
        elements.galleryInput.value = "";
    });
}

elements.fileInput.addEventListener(
"change",
() => {
    const file = elements.fileInput.files?.[0];
    if (file) {
        handleFile(file);
    }
    elements.fileInput.value = "";
}
);

document.addEventListener("click", event => {
    if (!elements.attachMenu || !elements.attachMenu.classList.contains("show")) {
        return;
    }
    const inside =
        elements.attachMenu.contains(event.target) ||
        elements.imageButton.contains(event.target);
    if (!inside) {
        closeAttachMenu();
    }
});


elements.removeAttachment.addEventListener(
"click",
resetAttachment
);

elements.chatMode.addEventListener(
"click",
() => {

setMode(  
        "chat"  
    );  
}

);

elements.imageMode.addEventListener(
"click",
() => {

setMode(  
        "image"  
    );  
}

);

elements.newChatButton.addEventListener(
"click",
() => {

createChat();  

    elements.messageInput.focus();  

    closeHistory();  
}

);

elements.historyClose.addEventListener(
"click",
() => {

closeHistory();  

    elements.messageInput.focus();  
}

);

elements.mobileMenu.addEventListener(
"click",
() => {

toggleHistory();  
}

);

/*

- Klik di luar sidebar

- pada mobile menutup history.
  */
  document.addEventListener(
  "click",
  event => {

  if (  
       window.innerWidth >  
       720  
   ) {  

       return;  
   }  


   if (  
       !elements.sidebar  
           .classList  
           .contains(  
               "open"  
           )  
   ) {  

       return;  
   }  


   const insideSidebar =  
       elements.sidebar.contains(  
           event.target  
       );  


   const clickedMenu =  
       elements.mobileMenu.contains(  
           event.target  
       );  


   if (  
       !insideSidebar &&  
       !clickedMenu  
   ) {  

       closeHistory();  
   }

  }
  );

/*

- Suggestions.
  */
  document
  .querySelectorAll(
  ".suggestion"
  )
  .forEach(
  button => {

  button.addEventListener(  
           "click",  
           () => {  

               elements  
                   .messageInput  
                   .value =  
                       button.dataset  
                           .prompt ||  
                       "";  

               autoResize();  

               elements  
                   .messageInput  
                   .focus();  
           }  
       );  
   }

  );

/* =========================================================
INITIAL LOAD
========================================================= */

loadChats();

if (!chats.length) {

createChat();

} else {

const saved =  
    loadActiveChat();  


if (  
    saved &&  
    chats.some(  
        chat =>  
            chat.id ===  
            saved  
    )  
) {  

    currentChatId =  
        saved;  

} else {  

    sortChats();  

    currentChatId =  
        chats[0].id;  
}  


saveActiveChat();  

renderHistory();  

renderMessages();

}

setMode(
"chat"
);

autoResize();

elements.statusText.textContent =
"Online / AI";

</script>  </body>  
</html>
