<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f4efe6"
    >

    <meta
        name="description"
        content="Pingu AI - Asisten AI dengan dukungan gambar, matematika, kode, dan sumber informasi."
    >

    <title>Pingu AI</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [
                    ["$", "$"],
                    ["\\(", "\\)"]
                ],
                displayMath: [
                    ["$$", "$$"],
                    ["\\[", "\\]"]
                ],
                processEscapes: true,
                processEnvironments: true,
                packages: {
                    "[+]": ["ams", "boldsymbol"]
                }
            },

            options: {
                skipHtmlTags: [
                    "script",
                    "noscript",
                    "style",
                    "textarea",
                    "pre",
                    "code"
                ],
                ignoreHtmlClass: "math-ignore"
            },

            startup: {
                typeset: false
            }
        };
    </script>

    <script
        id="MathJax-script"
        async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4efe6;
            --bg-soft: #faf7f1;

            --glass: rgba(255,255,255,.62);
            --glass-strong: rgba(255,255,255,.78);
            --glass-soft: rgba(255,255,255,.42);

            --border: rgba(55,48,39,.10);
            --border-light: rgba(255,255,255,.78);

            --text: #292720;
            --text-soft: #625e56;
            --muted: #918b82;

            --accent: #6f5ce7;
            --accent-dark: #5947d0;

            --danger: #d95555;

            --source-bg: rgba(255,255,255,.58);
            --source-hover: rgba(255,255,255,.82);

            --radius: 18px;
            --sidebar: 270px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(255,255,255,.85),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(224,216,201,.55),
                    transparent 32%
                ),
                var(--bg);

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
        }

        a {
            color: inherit;
        }

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: var(--sidebar);
            height: 100%;
            padding: 16px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            background: rgba(255,255,255,.34);
            border-right: 1px solid var(--border);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            flex-shrink: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 6px 14px;
        }

        .brand-logo,
        .welcome-logo {
            display: grid;
            place-items: center;

            background:
                linear-gradient(
                    145deg,
                    #fff,
                    #e8e0d3
                );

            border: 1px solid var(--border-light);

            color: var(--accent);

            box-shadow:
                0 8px 25px rgba(52,43,31,.08);
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 13px;

            font-size: 17px;
            font-weight: 800;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 750;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .new-chat {
            width: 100%;
            min-height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border-radius: 14px;

            background: var(--glass-strong);
            border: 1px solid var(--border-light);

            color: var(--text);
            font-weight: 650;

            box-shadow:
                0 5px 18px rgba(55,48,39,.06);

            transition:
                transform .15s ease,
                background .15s ease;
        }

        .new-chat:hover {
            background: rgba(255,255,255,.9);
        }

        .new-chat:active {
            transform: scale(.98);
        }

        .history-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;

            padding: 8px 5px 2px 7px;
        }

        .history-title {
            font-size: 11px;
            font-weight: 700;

            color: var(--muted);

            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .history-close {
            width: 28px;
            height: 28px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: rgba(255,255,255,.52);
            border: 1px solid var(--border);

            color: var(--text-soft);

            font-size: 18px;
            line-height: 1;

            transition:
                background .15s ease,
                color .15s ease,
                transform .15s ease;
        }

        .history-close:hover {
            background: rgba(255,255,255,.85);
            color: var(--text);
        }

        .history-close:active {
            transform: scale(.92);
        }

        .history {
            flex: 1;
            min-height: 0;

            overflow-y: auto;
            padding-right: 2px;
        }

        .history::-webkit-scrollbar {
            width: 4px;
        }

        .history::-webkit-scrollbar-thumb {
            background: rgba(70,60,50,.13);
            border-radius: 20px;
        }

        .history-empty {
            padding: 12px 8px;

            font-size: 12px;
            line-height: 1.5;

            color: var(--muted);
        }

        .history-item-wrap {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 4px;
            margin-bottom: 5px;
        }

        .history-item {
            flex: 1;
            min-width: 0;

            display: flex;
            align-items: center;

            padding: 10px 11px;

            border-radius: 12px;

            background: transparent;
            color: var(--text-soft);

            text-align: left;
            font-size: 12px;

            transition:
                background .15s ease,
                color .15s ease;
        }

        .history-item:hover {
            background: rgba(255,255,255,.48);
            color: var(--text);
        }

        .history-item.active {
            background: rgba(255,255,255,.7);
            color: var(--text);

            border: 1px solid rgba(55,48,39,.07);
        }

        .history-delete {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: transparent;
            color: var(--muted);

            font-size: 14px;

            transition:
                background .15s ease,
                color .15s ease;
        }

        .history-delete:hover {
            background: rgba(217,85,85,.12);
            color: var(--danger);
        }

        .sidebar-footer {
            padding-top: 8px;
            border-top: 1px solid rgba(55,48,39,.07);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px;

            font-size: 11px;
            color: var(--muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #54a86a;

            box-shadow:
                0 0 0 3px rgba(84,168,106,.12);
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            min-width: 0;
            height: 100%;

            flex: 1;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        .topbar {
            min-height: 62px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);

            background: rgba(255,255,255,.28);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-menu {
            display: none;

            place-items: center;

            width: 36px;
            height: 36px;

            border-radius: 10px;

            background: rgba(255,255,255,.56);
            border: 1px solid var(--border);

            color: var(--text-soft);

            font-size: 16px;
        }

        .top-title {
            font-size: 15px;
            font-weight: 720;
        }

        .top-model {
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat-container {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding:
                34px
                max(20px, 5vw)
                180px;
        }

        .chat-container::-webkit-scrollbar {
            width: 5px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(60,50,40,.12);
            border-radius: 20px;
        }

        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {
            max-width: 760px;

            margin: 8vh auto 0;

            text-align: center;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 17px;

            border-radius: 21px;

            font-size: 25px;
            font-weight: 850;
        }

        .welcome h1 {
            font-size: clamp(27px, 5vw, 42px);

            line-height: 1.1;

            letter-spacing: -1.4px;
        }

        .welcome p {
            margin: 12px auto 0;

            max-width: 560px;

            color: var(--text-soft);

            font-size: 14px;
            line-height: 1.6;
        }

        .suggestions {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0,1fr)
                );

            gap: 10px;

            max-width: 650px;

            margin: 30px auto 0;
        }

        .suggestion {
            padding: 15px;

            border-radius: 15px;

            text-align: left;

            background: var(--glass);
            border: 1px solid var(--border-light);

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.45;

            box-shadow:
                0 5px 18px rgba(55,48,39,.045);

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .suggestion:hover {
            background: rgba(255,255,255,.78);
            transform: translateY(-1px);
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            max-width: 820px;

            margin: 0 auto 20px;

            display: flex;

            gap: 10px;

            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 30px;
            height: 30px;

            flex: 0 0 30px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background: rgba(255,255,255,.68);
            border: 1px solid var(--border-light);

            color: var(--accent);

            font-size: 11px;
            font-weight: 800;
        }

        .message.user .message-avatar {
            display: none;
        }

        .message-content {
            min-width: 0;

            max-width:
                min(
                    760px,
                    88%
                );
        }

        .message-bubble {
            padding: 12px 15px;

            border-radius: 17px;

            font-size: 14px;
            line-height: 1.65;

            overflow-wrap: anywhere;
        }

        .message.assistant .message-bubble {
            background: rgba(255,255,255,.47);

            border:
                1px solid
                rgba(255,255,255,.68);

            color: var(--text);
        }

        .message.user .message-bubble {
            background: var(--accent);
            color: #fff;

            border-bottom-right-radius: 5px;

            box-shadow:
                0 5px 16px rgba(111,92,231,.16);
        }

        .message-bubble a {
            color: var(--accent-dark);

            text-decoration:
                underline;

            text-decoration-thickness:
                1px;

            text-underline-offset:
                2px;
        }

        .message.user .message-bubble a {
            color: #fff;
        }

        /* =====================================================
           MESSAGE EDIT
        ===================================================== */

        .message-actions {
            display: flex;

            gap: 6px;

            margin-top: 4px;

            justify-content: flex-end;
        }

        .message-edit-btn {
            background: transparent;

            color: var(--muted);

            font-size: 11px;

            padding:
                2px 6px;

            border-radius: 6px;

            cursor: pointer;
        }

        .message-edit-btn:hover {
            background: rgba(0,0,0,.05);
            color: var(--text);
        }

        .message.user .message-edit-btn {
            color: rgba(255,255,255,.8);
        }

        .message.user .message-edit-btn:hover {
            background: rgba(255,255,255,.15);
            color: #fff;
        }

        /* =====================================================
           SOURCES
        ===================================================== */

        .sources {
            margin-top: 11px;

            display: flex;
            flex-direction: column;

            gap: 7px;

            max-width: 100%;
        }

        .sources-title {
            display: flex;
            align-items: center;
            gap: 7px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 750;

            text-transform: uppercase;
            letter-spacing: .65px;
        }

        .sources-title-line {
            height: 1px;
            flex: 1;

            background:
                rgba(55,48,39,.08);
        }

        .source-list {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0,1fr)
                );

            gap: 7px;
        }

        .source-card {
            min-width: 0;

            display: flex;
            align-items: center;

            gap: 9px;

            padding: 9px 10px;

            border-radius: 11px;

            background: var(--source-bg);

            border:
                1px solid
                rgba(55,48,39,.08);

            color: var(--text);

            text-decoration: none;

            transition:
                background .15s ease,
                border-color .15s ease,
                transform .15s ease;
        }

        .source-card:hover {
            background: var(--source-hover);

            border-color:
                rgba(111,92,231,.18);

            transform: translateY(-1px);
        }

        .source-icon {
            width: 27px;
            height: 27px;

            flex:
                0 0 27px;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background:
                rgba(111,92,231,.10);

            color: var(--accent);

            font-size: 11px;
            font-weight: 800;
        }

        .source-info {
            min-width: 0;
            flex: 1;
        }

        .source-name {
            display: block;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 11px;
            font-weight: 650;
        }

        .source-domain {
            display: block;

            margin-top: 2px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            color: var(--muted);

            font-size: 9px;
        }

        .source-arrow {
            color: var(--muted);

            font-size: 12px;

            flex-shrink: 0;
        }

        /* =====================================================
           MATH
        ===================================================== */

        .math-display {
            width: 100%;

            margin: 15px 0;

            padding: 10px 4px;

            overflow-x: auto;
            overflow-y: hidden;

            text-align: center;

            border-radius: 10px;
        }

        .math-inline {
            display: inline;
        }

        .math-inline mjx-container {
            display:
                inline-block !important;
        }

        .message-bubble mjx-container {
            color: inherit !important;
        }

        .message-bubble
        mjx-container[display="true"] {
            margin:
                12px 0 !important;

            max-width: 100%;

            overflow-x: auto;
            overflow-y: hidden;

            padding: 3px 0;
        }

        .message-bubble
        mjx-container {
            font-size:
                103% !important;
        }

        .message.user mjx-container {
            color: #fff !important;
        }

        /* =====================================================
           CODE
        ===================================================== */

        .code-wrapper {
            width: 100%;

            margin: 13px 0;

            overflow: hidden;

            border-radius: 13px;

            background: #25231f;

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 5px 18px
                rgba(30,27,23,.12);

            text-align: left;
        }

        .code-header {
            min-height: 36px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            padding:
                5px 7px
                5px 12px;

            background: #2d2a25;

            border-bottom:
                1px solid
                rgba(255,255,255,.08);
        }

        .code-language {
            min-width: 0;

            color:
                rgba(238,234,226,.62);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 10px;

            text-transform:
                lowercase;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .copy-code {
            min-width: 52px;
            min-height: 27px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 0 9px;

            flex-shrink: 0;

            border-radius: 7px;

            background:
                rgba(255,255,255,.09);

            color:
                rgba(238,234,226,.88);

            font-size: 10px;
            font-weight: 650;
        }

        .copy-code:hover {
            background:
                rgba(255,255,255,.16);

            color: #fff;
        }

        .copy-code.copied {
            background:
                rgba(111,92,231,.35);

            color: #fff;
        }

        .copy-code.failed {
            background:
                rgba(217,85,85,.25);

            color: #fff;
        }

        .code {
            display: block;

            width: 100%;

            margin: 0;

            padding: 14px;

            overflow-x: auto;

            background: #25231f;
            color: #eeeae2;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 12px;

            line-height: 1.55;

            white-space: pre;

            tab-size: 4;
        }

        .inline-code {
            display: inline;

            padding: 2px 5px;

            border-radius: 5px;

            background:
                rgba(80,70,60,.08);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: .9em;
        }

        .message-bubble strong {
            font-weight: 750;
        }

        /* =====================================================
           IMAGE
        ===================================================== */

        .message-image {
            display: block;

            width: auto;

            max-width:
                min(
                    420px,
                    100%
                );

            max-height: 420px;

            margin-top: 9px;

            border-radius: 14px;

            border:
                1px solid
                rgba(55,48,39,.08);

            object-fit: contain;

            background:
                rgba(255,255,255,.4);
        }

        .message-meta {
            margin-top: 5px;

            font-size: 10px;

            color: var(--muted);
        }

        .message.user .message-meta {
            text-align: right;
        }

        /* =====================================================
           ATTACHMENT
        ===================================================== */

        .attachment {
            display: none;

            position: fixed;

            left:
                calc(
                    var(--sidebar) + 20px
                );

            right: 20px;

            bottom: 92px;

            max-width: 760px;

            margin: 0 auto;

            z-index: 15;
        }

        .attachment.show {
            display: block;
        }

        .attachment-inner {
            display: flex;

            align-items: center;

            gap: 10px;

            width: fit-content;

            max-width: 100%;

            padding: 8px;

            border-radius: 15px;

            background:
                rgba(255,255,255,.76);

            border:
                1px solid
                var(--border-light);

            box-shadow:
                0 10px 30px
                rgba(55,48,39,.12);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);
        }

        .attachment-image {
            width: 52px;
            height: 52px;

            object-fit: cover;

            border-radius: 10px;
        }

        .attachment-info {
            min-width: 0;
            max-width: 220px;
        }

        .attachment-name {
            font-size: 12px;
            font-weight: 650;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .attachment-mode {
            margin-top: 3px;

            font-size: 10px;

            color: var(--muted);
        }

        .attachment-remove {
            width: 30px;
            height: 30px;

            border-radius: 9px;

            background:
                rgba(217,85,85,.09);

            color: var(--danger);

            font-size: 17px;
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                14px
                max(18px, 4vw)
                calc(
                    14px +
                    env(safe-area-inset-bottom)
                );

            pointer-events: none;
        }

        .composer {
            width:
                min(
                    820px,
                    100%
                );

            margin: 0 auto;

            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 8px;

            border-radius: 18px;

            background:
                rgba(255,255,255,.74);

            border:
                1px solid
                var(--border-light);

            box-shadow:
                0 10px 35px
                rgba(55,48,39,.11);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            pointer-events: auto;
        }

        .composer-button {
            width: 40px;
            height: 40px;

            flex:
                0 0 40px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background:
                rgba(245,241,234,.8);

            border:
                1px solid
                rgba(55,48,39,.07);

            color: var(--text-soft);

            font-size: 18px;
        }

        .composer-button.active {
            background:
                rgba(111,92,231,.12);

<script type="module">

/* =========================================================
   SYSTEM PROMPT
========================================================= */

const CREATOR_SYSTEM_PROMPT =
"Kamu adalah Pingu AI, sebuah kecerdasan buatan mandiri yang dikembangkan dan diciptakan sepenuhnya oleh Hoidir sebagai pembuat utama. Jika pengguna bertanya siapa yang membuatmu, siapa penciptamu, atau siapa pembuat script ini, jawab bahwa kamu diciptakan dan dikembangkan oleh Hoidir. Jika pengguna meminta sumber, referensi, website resmi, atau link, berikan URL yang benar-benar relevan jika kamu mengetahuinya. Jangan membuat-buat URL. Jika tidak mengetahui URL yang benar, katakan bahwa kamu tidak dapat memverifikasinya. Jika API menyediakan kemampuan pencarian atau sumber eksternal, gunakan sumber tersebut dan tampilkan referensinya.";


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
    document.getElementById(id);

const elements = {

    sidebar:
        $("sidebar"),

    mobileMenu:
        $("mobileMenu"),

    historyClose:
        $("historyClose"),

    newChatButton:
        $("newChatButton"),

    history:
        $("history"),

    welcome:
        $("welcome"),

    messages:
        $("messages"),

    chatContainer:
        $("chatContainer"),

    typing:
        $("typing"),

    composer:
        $("composer"),

    messageInput:
        $("messageInput"),

    sendButton:
        $("sendButton"),

    imageButton:
        $("imageButton"),

    fileInput:
        $("fileInput"),

    attachment:
        $("attachment"),

    attachmentImage:
        $("attachmentImage"),

    attachmentName:
        $("attachmentName"),

    attachmentMode:
        $("attachmentMode"),

    removeAttachment:
        $("removeAttachment"),

    modeRow:
        $("modeRow"),

    chatMode:
        $("chatMode"),

    imageMode:
        $("imageMode"),

    modelLabel:
        $("modelLabel"),

    statusText:
        $("statusText")
};


/* =========================================================
   CONSTANTS
========================================================= */

const STORAGE_KEY =
    "pingu_ai_chats_v2";

const ACTIVE_CHAT_KEY =
    "pingu_ai_active_chat_v2";


/* =========================================================
   STATE
========================================================= */

let chats = [];

let currentChatId =
    null;

let attachedImage =
    null;

let attachedImagePreview =
    null;

let currentMode =
    "chat";

let isSending =
    false;


/* =========================================================
   ID
========================================================= */

function makeId() {

    if (
        typeof crypto !==
            "undefined" &&
        typeof crypto.randomUUID ===
            "function"
    ) {

        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function normalizeSources(sources) {

    if (!Array.isArray(sources)) {
        return [];
    }

    return sources
        .map(source => {

            if (
                typeof source ===
                "string"
            ) {

                return {
                    title:
                        getDomainName(source),

                    url:
                        source
                };
            }

            if (
                source &&
                typeof source ===
                "object"
            ) {

                const url =
                    source.url ||
                    source.link ||
                    source.href ||
                    "";

                if (!url) {
                    return null;
                }

                return {
                    title:
                        source.title ||
                        source.name ||
                        source.label ||
                        getDomainName(url),

                    url:
                        url
                };
            }

            return null;
        })
        .filter(Boolean)
        .filter(source =>
            isValidHttpUrl(
                source.url
            )
        )
        .slice(0, 12);
}


function normalizeLocalChats(parsed) {

    if (
        !Array.isArray(parsed)
    ) {

        return [];
    }

    return parsed
        .filter(chat =>
            chat &&
            typeof chat ===
                "object" &&
            typeof chat.id ===
                "string" &&
            Array.isArray(
                chat.messages
            )
        )
        .map(chat => ({

            id:
                chat.id,

            title:
                typeof chat.title ===
                    "string"
                    ? chat.title
                    : "Chat baru",

            messages:
                chat.messages.map(
                    message => ({

                        ...message,

                        id:
                            message.id ||
                            makeId(),

                        time:
                            Number(
                                message.time
                            ) ||
                            Date.now(),

                        sources:
                            normalizeSources(
                                message.sources
                            )

                    })
                ),

            createdAt:
                Number(
                    chat.createdAt
                ) ||
                Date.now(),

            updatedAt:
                Number(
                    chat.updatedAt
                ) ||
                Number(
                    chat.createdAt
                ) ||
                Date.now()

        }));
}


function loadChats() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {

            chats = [];

            return;
        }

        chats =
            normalizeLocalChats(
                JSON.parse(saved)
            );

    } catch (error) {

        console.warn(
            "Gagal membaca history:",
            error
        );

        chats = [];
    }
}


function saveChats() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(chats)
        );

        if (currentChatId) {

            localStorage.setItem(
                ACTIVE_CHAT_KEY,
                currentChatId
            );
        }

    } catch (error) {

        console.warn(
            "Local history penuh atau gagal disimpan:",
            error
        );

        try {

            const textOnly =
                chats.map(chat => ({

                    ...chat,

                    messages:
                        chat.messages.map(
                            message => {

                                const copy =
                                    {
                                        ...message
                                    };

                                delete copy.image;

                                return copy;
                            }
                        )

                }));

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    textOnly
                )
            );

        } catch {}
    }
}


function loadActiveChat() {

    try {

        return localStorage.getItem(
            ACTIVE_CHAT_KEY
        );

    } catch {

        return null;
    }
}


function saveActiveChat() {

    try {

        if (currentChatId) {

            localStorage.setItem(
                ACTIVE_CHAT_KEY,
                currentChatId
            );
        }

    } catch {}
}


/* =========================================================
   CHAT
========================================================= */

function createChat() {

    const now =
        Date.now();

    const chat = {

        id:
            makeId(),

        title:
            "Chat baru",

        messages:
            [],

        createdAt:
            now,

        updatedAt:
            now
    };

    chats.unshift(
        chat
    );

    currentChatId =
        chat.id;

    saveChats();

    renderHistory();
    renderMessages();

    return chat;
}


function getCurrentChat() {

    return chats.find(
        chat =>
            chat.id ===
            currentChatId
    );
}


function ensureChat() {

    let chat =
        getCurrentChat();

    if (!chat) {
        chat =
            createChat();
    }

    return chat;
}


function sortChats() {

    chats.sort(
        (a, b) =>
            Number(
                b.updatedAt || 0
            ) -
            Number(
                a.updatedAt || 0
            )
    );
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {

    sortChats();

    elements.history.innerHTML =
        "";

    if (!chats.length) {

        elements.history.innerHTML = `
            <div class="history-empty">
                Belum ada percakapan.
            </div>
        `;

        return;
    }

    for (
        const chat of chats
    ) {

        const wrap =
            document.createElement(
                "div"
            );

        wrap.className =
            "history-item-wrap";

        const button =
            document.createElement(
                "button"
            );

        button.type =
            "button";

        button.className =
            "history-item" +
            (
                chat.id ===
                currentChatId
                    ? " active"
                    : ""
            );

        button.textContent =
            chat.title ||
            "Chat baru";

        button.addEventListener(
            "click",
            () => {

                currentChatId =
                    chat.id;

                saveActiveChat();

                renderHistory();
                renderMessages();

                closeHistory();
            }
        );

        const deleteBtn =
            document.createElement(
                "button"
            );

        deleteBtn.type =
            "button";

        deleteBtn.className =
            "history-delete";

        deleteBtn.title =
            "Hapus percakapan";

        deleteBtn.innerHTML =
            "×";

        deleteBtn.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                chats =
                    chats.filter(
                        c =>
                            c.id !==
                            chat.id
                    );

                if (
                    currentChatId ===
                    chat.id
                ) {

                    if (
                        chats.length >
                        0
                    ) {

                        currentChatId =
                            chats[0].id;

                    } else {

                        createChat();
                    }
                }

                saveChats();
                saveActiveChat();

                renderHistory();
                renderMessages();
            }
        );

        wrap.appendChild(
            button
        );

        wrap.appendChild(
            deleteBtn
        );

        elements.history.appendChild(
            wrap
        );
    }
}


/* =========================================================
   HISTORY CLOSE
========================================================= */

function closeHistory() {

    elements.sidebar
        .classList
        .remove(
            "open"
        );
}


function toggleHistory() {

    elements.sidebar
        .classList
        .toggle(
            "open"
        );
}


/* =========================================================
   URL / SOURCE HELPERS
========================================================= */

function isValidHttpUrl(value) {

    try {

        const url =
            new URL(
                String(value)
            );

        return (
            url.protocol ===
                "http:" ||
            url.protocol ===
                "https:"
        );

    } catch {

        return false;
    }
}


function cleanUrl(value) {

    let url =
        String(
            value || ""
        ).trim();

    url =
        url.replace(
            /[),.;!?]+$/g,
            ""
        );

    return url;
}


function getDomainName(url) {

    try {

        const parsed =
            new URL(
                url
            );

        return parsed.hostname
            .replace(
                /^www\./,
                ""
            );

    } catch {

        return "Sumber";
    }
}


function getSourceTitle(url) {

    const domain =
        getDomainName(
            url
        );

    if (
        domain ===
        "kompas.tv"
    ) {

        return "Kompas TV";

    }

    if (
        domain ===
        "youtube.com" ||
        domain ===
        "youtu.be"
    ) {

        return "YouTube";

    }

    if (
        domain ===
        "wikipedia.org"
    ) {

        return "Wikipedia";

    }

    if (
        domain ===
        "github.com"
    ) {

        return "GitHub";
    }

    return domain;
}


/*
 * Mengambil URL dari teks AI.
 */
function extractUrls(text) {

    const source =
        String(
            text || ""
        );

    const matches =
        source.match(
            /https?:\/\/[^\s<>"']+/gi
        ) || [];

    const unique =
        [];

    for (
        const raw of matches
    ) {

        const url =
            cleanUrl(
                raw
            );

        if (
            !isValidHttpUrl(
                url
            )
        ) {
            continue;
        }

        if (
            !unique.some(
                item =>
                    item.url ===
                    url
            )
        ) {

            unique.push({

                title:
                    getSourceTitle(
                        url
                    ),

                url:
                    url
            });
        }
    }

    return unique.slice(
        0,
        12
    );
}


/*
 * Mengambil sumber dari beberapa
 * kemungkinan struktur response API.
 */
function extractSources(data) {

    if (!data) {
        return [];
    }

    const candidates = [];

    if (
        Array.isArray(
            data.sources
        )
    ) {

        candidates.push(
            ...data.sources
        );
    }

    if (
        Array.isArray(
            data.references
        )
    ) {

        candidates.push(
            ...data.references
        );
    }

    if (
        Array.isArray(
            data.citations
        )
    ) {

        candidates.push(
            ...data.citations
        );
    }

    if (
        data.source &&
        typeof data.source ===
            "object"
    ) {

        candidates.push(
            data.source
        );
    }

    const normalized =
        normalizeSources(
            candidates
        );

    const replyUrls =
        extractUrls(
            data.reply ||
            data.text ||
            data.content ||
            ""
        );

    const combined =
        [
            ...normalized,
            ...replyUrls
        ];

    const unique =
        [];

    for (
        const item of combined
    ) {

        if (
            !unique.some(
                source =>
                    source.url ===
                    item.url
            )
        ) {

            unique.push(
                item
            );
        }
    }

    return unique.slice(
        0,
        12
    );
}


/* =========================================================
   HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/*
 * Escape URL sebelum dimasukkan
 * ke atribut HTML.
 */
function safeHref(url) {

    const clean =
        cleanUrl(
            url
        );

    if (
        !isValidHttpUrl(
            clean
        )
    ) {

        return "#";
    }

    return escapeHTML(
        clean
    );
}


/* =========================================================
   MARKDOWN LINKS
========================================================= */

function renderMarkdownLinks(
    text
) {

    return text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,
        (
            _,
            title,
            url
        ) => {

            const safe =
                safeHref(
                    url
                );

            if (
                safe === "#"
            ) {

                return escapeHTML(
                    title
                );
            }

            return `
                <a
                    href="${safe}"
                    target="_blank"
                    rel="noopener noreferrer"
                >${escapeHTML(title)}</a>
            `;
        }
    );
}


/* =========================================================
   MATH
========================================================= */

function extractMathBlocks(
    source,
    blocks
) {

    source =
        source.replace(
            /\$\$([\s\S]*?)\$\$/g,
            (_, math) => {

                const index =
                    blocks.length;

                blocks.push({

                    type:
                        "display-math",

                    content:
                        String(
                            math || ""
                        ).trim()
                });

                return `
                    __PINGU_MATH_BLOCK_${index}__
                `;
            }
        );

    source =
        source.replace(
            /\\\[([\s\S]*?)\\\]/g,
            (_, math) => {

                const index =
                    blocks.length;

                blocks.push({

                    type:
                        "display-math",

                    content:
                        String(
                            math || ""
                        ).trim()
                });

                return `
                    __PINGU_MATH_BLOCK_${index}__
                `;
            }
        );

    source =
        source.replace(
            /\\\(([\s\S]*?)\\\)/g,
            (_, math) => {

                const index =
                    blocks.length;

                blocks.push({

                    type:
                        "inline-math",

                    content:
                        String(
                            math || ""
                        ).trim()
                });

                return `
                    __PINGU_MATH_BLOCK_${index}__
                `;
            }
        );

    source =
        source.replace(
            /(^|[^\$])\$([^\$\n]+)\$(?!\$)/g,
            (
                full,
                before,
                math
            ) => {

                const index =
                    blocks.length;

                blocks.push({

                    type:
                        "inline-math",

                    content:
                        String(
                            math || ""
                        ).trim()
                });

                return (
                    before +
                    `__PINGU_MATH_BLOCK_${index}__`
                );
            }
        );

    return source;
}


/* =========================================================
   NORMAL TEXT
========================================================= */

function formatNormalText(
    text
) {

    if (!text) {
        return "";
    }

    let output =
        escapeHTML(
            text
        );

    output =
        output.replace(
            /`([^`\n]+)`/g,
            '<span class="inline-code">$1</span>'
        );

    output =
        output.replace(
            /\*\*([^*\n]+)\*\*/g,
            "<strong>$1</strong>"
        );

    /*
     * URL langsung menjadi link.
     */
    output =
        output.replace(
            /(https?:\/\/[^\s<>"']+)/gi,
            raw => {

                const url =
                    cleanUrl(
                        raw
                    );

                const safe =
                    safeHref(
                        url
                    );

                if (
                    safe === "#"
                ) {

                    return raw;
                }

                return `
                    <a
                        href="${safe}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >${escapeHTML(url)}</a>
                `;
            }
        );

    output =
        output.replace(
            /\r?\n/g,
            "<br>"
        );

    return output;
}


/* =========================================================
   FORMAT TEXT
========================================================= */

function formatText(
    text
) {

    let source =
        String(
            text ?? ""
        );

    const blocks = [];


    /*
     * Code block.
     */
    source =
        source.replace(
            /```[ \t]*([a-zA-Z0-9_+#.-]*)[ \t]*\r?\n([\s\S]*?)```/g,
            (
                _,
                language,
                code
            ) => {

                const index =
                    blocks.length;

                blocks.push({

                    type:
                        "code",

                    language:
                        String(
                            language || ""
                        ).trim() ||
                        "code",

                    content:
                        String(
                            code || ""
                        ).replace(
                            /\r?\n$/,
                            ""
                        )

                });

                return `
                    __PINGU_CODE_BLOCK_${index}__
                `;
            }
        );


    /*
     * Markdown links sebelum
     * escape HTML.
     */
    source =
        source.replace(
            /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,
            (
                _,
                title,
                url
            ) => {

                const index =
                    blocks.length;

                blocks.push({

                    type:
                        "link",

                    title:
                        title,

                    url:
                        cleanUrl(
                            url
                        )

                });

                return `
                    __PINGU_LINK_BLOCK_${index}__
                `;
            }
        );


    /*
     * Math.
     */
    source =
        extractMathBlocks(
            source,
            blocks
        );


    let output =
        formatNormalText(
            source
        );


    /*
     * Render semua placeholder.
     */
    for (
        let i = 0;
        i < blocks.length;
        i++
    ) {

        const block =
            blocks[i];

        const codePlaceholder =
            `__PINGU_CODE_BLOCK_${i}__`;

        const mathPlaceholder =
            `__PINGU_MATH_BLOCK_${i}__`;

        const linkPlaceholder =
            `__PINGU_LINK_BLOCK_${i}__`;


        if (
            block.type ===
            "code"
        ) {

            output =
                output.replace(
                    codePlaceholder,
                    `
                    <div class="code-wrapper">

                        <div class="code-header">

                            <span class="code-language">
                                ${escapeHTML(
                                    block.language
                                )}
                            </span>

                            <button
                                class="copy-code"
                                type="button"
                            >
                                Salin
                            </button>

                        </div>

                        <pre class="code"><code>${escapeHTML(
                            block.content
                        )}</code></pre>

                    </div>
                    `
                );

        } else if (
            block.type ===
            "display-math"
        ) {

            output =
                output.replace(
                    mathPlaceholder,
                    `<div class="math-display" data-math-index="${i}"></div>`
                );

        } else if (
            block.type ===
            "inline-math"
        ) {

            output =
                output.replace(
                    mathPlaceholder,
                    `<span class="math-inline" data-math-index="${i}"></span>`
                );

        } else if (
            block.type ===
            "link"
        ) {

            const safe =
                safeHref(
                    block.url
                );

            if (
                safe === "#"
            ) {

                output =
                    output.replace(
                        linkPlaceholder,
                        escapeHTML(
                            block.title
                        )
                    );

            } else {

                output =
                    output.replace(
                        linkPlaceholder,
                        `
                        <a
                            href="${safe}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >${escapeHTML(
                            block.title
                        )}</a>
                        `
                    );
            }
        }
    }


    return {

        html:
            output,

        blocks
    };
}


/* =========================================================
   MATH RENDER
========================================================= */

function renderMathBlocks(
    bubble,
    blocks
) {

    if (!bubble) {
        return;
    }

    bubble
        .querySelectorAll(
            "[data-math-index]"
        )
        .forEach(
            element => {

                const block =
                    blocks[
                        Number(
                            element.dataset
                                .mathIndex
                        )
                    ];

                if (!block) {
                    return;
                }

                if (
                    block.type ===
                    "display-math"
                ) {

                    element.textContent =
                        "\\[" +
                        block.content +
                        "\\]";

                } else {

                    element.textContent =
                        "\\(" +
                        block.content +
                        "\\)";
                }
            }
        );
}


async function typesetMath(
    element
) {

    if (!element) {
        return;
    }

    try {

        if (!window.MathJax) {
            return;
        }

        if (
            window.MathJax.startup &&
            window.MathJax.startup.promise
        ) {

            await window.MathJax
                .startup
                .promise;
        }

        if (
            typeof
                window.MathJax.typesetPromise ===
                "function"
        ) {

            await window.MathJax
                .typesetPromise(
                    [element]
                );
        }

    } catch (error) {

        console.warn(
            "MathJax gagal:",
            error
        );
    }
}

   SOURCE UI
========================================================= */

function createSourcesElement(
    sources
) {

    const normalized =
        normalizeSources(
            sources
        );

    if (
        !normalized.length
    ) {

        return null;
    }

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "sources";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "sources-title";

    title.innerHTML = `
        <span>Sumber</span>
        <span class="sources-title-line"></span>
    `;

    wrapper.appendChild(
        title
    );

    const list =
        document.createElement(
            "div"
        );

    list.className =
        "source-list";

    for (
        const source of normalized
    ) {

        const url =
            cleanUrl(
                source.url
            );

        if (
            !isValidHttpUrl(
                url
            )
        ) {
            continue;
        }

        const card =
            document.createElement(
                "a"
            );

        card.className =
            "source-card";

        card.href =
            url;

        card.target =
            "_blank";

        card.rel =
            "noopener noreferrer";

        const icon =
            document.createElement(
                "span"
            );

        icon.className =
            "source-icon";

        icon.textContent =
            "↗";

        const info =
            document.createElement(
                "span"
            );

        info.className =
            "source-info";

        const name =
            document.createElement(
                "span"
            );

        name.className =
            "source-name";

        name.textContent =
            source.title ||
            getSourceTitle(
                url
            );

        const domain =
            document.createElement(
                "span"
            );

        domain.className =
            "source-domain";

        domain.textContent =
            getDomainName(
                url
            );

        info.appendChild(
            name
        );

        info.appendChild(
            domain
        );

        const arrow =
            document.createElement(
                "span"
            );

        arrow.className =
            "source-arrow";

        arrow.textContent =
            "›";

        card.appendChild(
            icon
        );

        card.appendChild(
            info
        );

        card.appendChild(
            arrow
        );

        list.appendChild(
            card
        );
    }

    if (!list.children.length) {
        return null;
    }

    wrapper.appendChild(
        list
    );

    return wrapper;
}


/* =========================================================
   COPY CODE
========================================================= */

async function copyCode(
    button
) {

    const wrapper =
        button.closest(
            ".code-wrapper"
        );

    const code =
        wrapper
            ?.querySelector(
                "code"
            )
            ?.textContent ||
        "";

    try {

        await navigator
            .clipboard
            .writeText(
                code
            );

        button.textContent =
            "Tersalin";

        button.classList.add(
            "copied"
        );

        setTimeout(
            () => {

                button.textContent =
                    "Salin";

                button.classList.remove(
                    "copied"
                );

            },
            1500
        );

    } catch {

        button.textContent =
            "Gagal";

        button.classList.add(
            "failed"
        );

        setTimeout(
            () => {

                button.textContent =
                    "Salin";

                button.classList.remove(
                    "failed"
                );

            },
            1500
        );
    }
}


document.addEventListener(

        const button =

);

   RENDER MESSAGE
========================================================= */

function renderMessages() {

    const chat =
        getCurrentChat();

    elements.messages.innerHTML =
        "";

    if (
        !chat ||
        !chat.messages.length
    ) {

        elements.welcome.style.display =
            "block";

        return;
    }

    elements.welcome.style.display =

    for (

        chat.messages
    ) {

        renderMessage(

        );
    }

}


function renderMessage(
    message,
    scroll = true
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " +
        (
            message.role ===
            "user"
                ? "user"
                : "assistant"
        );


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "message-avatar";

    avatar.textContent =
        "P";


    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";


    const formatted =
        formatText(
            message.content ||
            ""
        );


    bubble.innerHTML =
        formatted.html;


    renderMathBlocks(
        bubble,
        formatted.blocks
    );


    content.appendChild(
        bubble
    );


    /*
     * Gambar.
     */
    if (message.image) {

        const image =
            document.createElement(
                "img"
            );

        image.className =
            "message-image";

        image.src =
            `data:${message.image.mimeType};base64,${message.image.data}`;

        image.alt =
            "Gambar";

        image.loading =
            "lazy";

        content.appendChild(
            image
        );
    }


    /*
     * Edit user message.
     */
    if (
        message.role ===
        "user"
    ) {

        const actionsDiv =
            document.createElement(
                "div"
            );

        actionsDiv.className =
            "message-actions";


        const editBtn =
            document.createElement(
                "button"
            );

        editBtn.type =
            "button";

        editBtn.className =
            "message-edit-btn";

        editBtn.textContent =
            "Edit";


        editBtn.addEventListener(
            "click",
            () => {

                elements
                    .messageInput
                    .value =
                        message.content;

                autoResize();

                elements
                    .messageInput
                    .focus();


                const chat =
                    getCurrentChat();

                if (chat) {

                    const index =
                        chat.messages
                            .findIndex(
                                m =>
                                    m.id ===
                                    message.id
                            );

                    if (
                        index !==
                        -1
                    ) {

                        chat.messages =
                            chat.messages
                                .slice(
                                    0,
                                    index
                                );

                        saveChats();

                        renderMessages();
                    }
                }
            }
        );


        actionsDiv.appendChild(
            editBtn
        );

        content.appendChild(
            actionsDiv
        );
    }


    /*
     * Model.
     */
    if (message.model) {

        const meta =
            document.createElement(
                "div"
            );

        meta.className =
            "message-meta";

        meta.textContent =
            message.model;

        content.appendChild(
            meta
        );
    }


    /*
     * Sources.
     *
     * Hanya tampil untuk AI.
     */
    if (
        message.role ===
            "assistant" &&
        Array.isArray(
            message.sources
        ) &&
        message.sources.length
    ) {

        const sourcesElement =
            createSourcesElement(
                message.sources
            );

        if (sourcesElement) {

            content.appendChild(
                sourcesElement
            );
        }
    }


    if (
        message.role ===
        "assistant"
    ) {

        wrapper.appendChild(
            avatar
        );
    }

    wrapper.appendChild(
        content
    );

    elements.messages.appendChild(
        wrapper
    );


    /*
     * MathJax.
     */
    if (
        formatted.blocks.some(
            block =>
                block.type ===
                    "display-math" ||
                block.type ===
                    "inline-math"
        )
    ) {

        typesetMath(
            bubble
        );
    }


    if (scroll) {
        scrollBottom();
    }
}


function scrollBottom() {

    requestAnimationFrame(
        () => {

            elements
                .chatContainer
                .scrollTop =
                    elements
                        .chatContainer
                        .scrollHeight;
        }
    );
}

function resetAttachment() {

    if (
        attachedImagePreview
    ) {

        URL.revokeObjectURL(
            attachedImagePreview
        );
    }

    attachedImage =
        null;

    attachedImagePreview =
        null;

    elements.fileInput.value =
        "";

    elements.attachment
        .classList
        .remove(
            "show"
        );

    elements.attachmentImage.src =
        "";

    elements.imageButton
        .classList
        .remove(
            "active"
        );

    elements.modeRow
        .classList
        .remove(
            "show"
        );

    setMode(
        "chat"
    );
}


function fileToBase64(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    const result =
                        String(
                            reader.result ||
                            ""
                        );

                    const comma =
                        result.indexOf(
                            ","
                        );

                    resolve(
                        comma === -1
                            ? result
                            : result.slice(
                                comma + 1
                            )
                    );
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


async function handleImage(
    file
) {

    if (!file) {
        return;
    }

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "File yang dipilih bukan gambar."
        );

        return;
    }

    if (
        file.size >
        15 * 1024 * 1024
    ) {

        alert(
            "Ukuran gambar terlalu besar. Maksimal 15 MB."
        );

        return;
    }

    try {

        const base64 =
            await fileToBase64(
                file
            );


        if (
            attachedImagePreview
        ) {

            URL.revokeObjectURL(
                attachedImagePreview
            );
        }


        attachedImage = {

            mimeType:
                file.type,

            data:
                base64,

            name:
                file.name,

            size:
                file.size
        };


        attachedImagePreview =
            URL.createObjectURL(
                file
            );


        elements
            .attachmentImage
            .src =
                attachedImagePreview;


        elements
            .attachmentName
            .textContent =
                file.name;


        elements
            .attachment
            .classList
            .add(
                "show"
            );


        elements
            .imageButton
            .classList
            .add(
                "active"
            );


        elements
            .modeRow
            .classList
            .add(
                "show"
            );


        setMode(
            "chat"
        );

    } catch {

        alert(
            "Gagal membaca gambar."
        );
    }
}


function updateAttachmentLabel() {

        .attachmentMode
        .textContent =
            currentMode ===
            "image"

function setMode(

) {

    currentMode =
        mode === "image"
