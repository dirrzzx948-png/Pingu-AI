<!DOCTYPE html>  <html lang="id">  
<head>  
    <meta charset="UTF-8">  <meta  
    name="viewport"  
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"  
>  

<meta  
    name="theme-color"  
    content="#f4efe6"  
>  

<meta  
    name="description"  
    content="Pingu AI - Asisten AI dengan dukungan gambar, matematika, kode, dan sumber informasi."  
>  

<title>Pingu AI</title>  

<script>  
    window.MathJax = {  
        tex: {  
            inlineMath: [  
                ["$", "$"],  
                ["\\(", "\\)"]  
            ],  
            displayMath: [  
                ["$$", "$$"],  
                ["\\[", "\\]"]  
            ],  
            processEscapes: true,  
            processEnvironments: true,  
            packages: {  
                "[+]": ["ams", "boldsymbol"]  
            }  
        },  

        options: {  
            skipHtmlTags: [  
                "script",  
                "noscript",  
                "style",  
                "textarea",  
                "pre",  
                "code"  
            ],  
            ignoreHtmlClass: "math-ignore"  
        },  

        startup: {  
            typeset: false  
        }  
    };  
</script>  

<script  
    id="MathJax-script"  
    async  
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"  
></script>  


<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #f3eee6;
        --bg-soft: #faf7f1;
        --glass: rgba(255, 255, 255, 0.58);
        --glass-strong: rgba(255, 255, 255, 0.82);
        --glass-soft: rgba(255, 255, 255, 0.38);
        --border: rgba(55, 48, 39, 0.10);
        --border-light: rgba(255, 255, 255, 0.82);
        --text: #2a2720;
        --text-soft: #5f5a52;
        --muted: #8f897f;
        --accent: #6f5ce7;
        --accent-dark: #5646c9;
        --accent-soft: rgba(111, 92, 231, 0.12);
        --accent-glow: rgba(111, 92, 231, 0.28);
        --danger: #d95555;
        --success: #3f9b66;
        --source-bg: rgba(255, 255, 255, 0.62);
        --source-hover: rgba(255, 255, 255, 0.88);
        --radius: 18px;
        --sidebar: 278px;
        --shadow-sm: 0 4px 14px rgba(55, 48, 39, 0.05);
        --shadow-md: 0 10px 28px rgba(55, 48, 39, 0.09);
        --shadow-lg: 0 16px 40px rgba(55, 48, 39, 0.12);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.35, 0.64, 1);
    }

    html, body {
        width: 100%;
        height: 100%;
    }

    body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
            radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.92), transparent 28%),
            radial-gradient(circle at 88% 82%, rgba(224, 216, 201, 0.55), transparent 30%),
            radial-gradient(circle at 50% 100%, rgba(111, 92, 231, 0.04), transparent 40%),
            var(--bg);
        color: var(--text);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    button, textarea, input {
        font: inherit;
    }

    button {
        border: 0;
        cursor: pointer;
        transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.18s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease), opacity 0.2s var(--ease);
    }

    button:disabled {
        cursor: default;
    }

    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
        outline: 2px solid rgba(111, 92, 231, 0.45);
        outline-offset: 2px;
    }

    a {
        color: inherit;
    }

    .app {
        width: 100%;
        height: 100dvh;
        display: flex;
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
        width: var(--sidebar);
        height: 100%;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: rgba(255, 255, 255, 0.38);
        border-right: 1px solid var(--border);
        backdrop-filter: blur(14px) saturate(1.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.1);
        flex-shrink: 0;
        z-index: 20;
        transition: transform 0.28s var(--ease), box-shadow 0.28s var(--ease);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 6px 12px;
    }

    .brand-logo,
    .welcome-logo {
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #fff, #ebe3d6);
        border: 1px solid var(--border-light);
        color: var(--accent);
        box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .brand-logo {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 800;
        overflow: hidden;
        transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease);
    }

    .brand:hover .brand-logo {
        transform: scale(1.06) rotate(-3deg);
        box-shadow: 0 8px 22px rgba(111, 92, 231, 0.16);
    }

    .brand-text {
        min-width: 0;
    }

    .brand-title {
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.2px;
    }

    .brand-subtitle {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
    }

    .new-chat {
        width: 100%;
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 14px;
        background: var(--glass-strong);
        border: 1px solid var(--border-light);
        color: var(--text);
        font-weight: 650;
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
    }

    .new-chat::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 20%, rgba(111, 92, 231, 0.08) 50%, transparent 80%);
        transform: translateX(-120%);
        transition: transform 0.5s var(--ease);
    }

    .new-chat:hover {
        background: #fff;
        box-shadow: 0 8px 22px rgba(55, 48, 39, 0.08);
        transform: translateY(-1px);
    }

    .new-chat:hover::before {
        transform: translateX(120%);
    }

    .new-chat:active {
        transform: scale(0.985) translateY(0);
    }

    .history-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 5px 2px 7px;
    }

    .history-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.7px;
    }

    .history-close {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid var(--border);
        color: var(--text-soft);
        font-size: 18px;
        line-height: 1;
    }

    .history-close:hover {
        background: rgba(255, 255, 255, 0.92);
        color: var(--text);
        transform: scale(1.05);
    }

    .history-close:active {
        transform: scale(0.92);
    }

    .history {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
        scroll-behavior: smooth;
    }

    .history::-webkit-scrollbar {
        width: 4px;
    }

    .history::-webkit-scrollbar-thumb {
        background: rgba(70, 60, 50, 0.14);
        border-radius: 20px;
    }

    .history-empty {
        padding: 12px 8px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
    }

    .history-item-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 5px;
        animation: fade-slide-in 0.28s var(--ease) both;
    }

    .history-item {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 10px 12px;
        border-radius: 12px;
        background: transparent;
        color: var(--text-soft);
        text-align: left;
        font-size: 12px;
        border: 1px solid transparent;
    }

    .history-item:hover {
        background: rgba(255, 255, 255, 0.55);
        color: var(--text);
    }

    .history-item.active {
        background: rgba(255, 255, 255, 0.78);
        color: var(--text);
        border-color: rgba(55, 48, 39, 0.07);
        box-shadow: var(--shadow-sm);
        font-weight: 600;
    }

    .history-delete {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        opacity: 0.65;
    }

    .history-item-wrap:hover .history-delete {
        opacity: 1;
    }

    .history-delete:hover {
        background: rgba(217, 85, 85, 0.12);
        color: var(--danger);
        transform: scale(1.08);
    }

    .sidebar-footer {
        padding-top: 10px;
        border-top: 1px solid rgba(55, 48, 39, 0.07);
    }

    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        font-size: 11px;
        color: var(--muted);
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #54a86a;
        box-shadow: 0 0 0 3px rgba(84, 168, 106, 0.14);
        animation: pulse-dot 2.4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
        0%, 100% { box-shadow: 0 0 0 3px rgba(84, 168, 106, 0.12); transform: scale(1); }
        50% { box-shadow: 0 0 0 6px rgba(84, 168, 106, 0.08); transform: scale(1.08); }
    }

    .hidden {
        display: none !important;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .main {
        min-width: 0;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .topbar {
        min-height: 62px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.42);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .mobile-menu {
        display: none;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid var(--border);
        color: var(--text-soft);
        font-size: 16px;
    }

    .mobile-menu:hover {
        background: #fff;
        color: var(--text);
        transform: scale(1.04);
    }

    .mobile-menu:active {
        transform: scale(0.96);
    }

    .top-title {
        font-size: 15px;
        font-weight: 720;
        letter-spacing: -0.2px;
    }

    .top-model {
        font-size: 11px;
        color: var(--muted);
        margin-top: 1px;
    }

    /* =====================================================
       CHAT
    ===================================================== */

    .chat-container {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 34px max(20px, 5vw) 180px;
        scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar {
        width: 5px;
    }

    .chat-container::-webkit-scrollbar-thumb {
        background: rgba(60, 50, 40, 0.12);
        border-radius: 20px;
    }

    /* =====================================================
       WELCOME
    ===================================================== */

    .welcome {
        max-width: 760px;
        margin: 8vh auto 0;
        text-align: center;
        animation: welcome-in 0.55s var(--ease) both;
    }

    @keyframes welcome-in {
        from { opacity: 0; transform: translateY(14px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .welcome-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 18px;
        border-radius: 24px;
        font-size: 25px;
        font-weight: 850;
        overflow: visible;
        transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease);
        box-shadow: 0 12px 32px rgba(55, 48, 39, 0.1);
    }

    .welcome-logo:hover {
        transform: translateY(-4px) scale(1.04);
        box-shadow: 0 18px 40px rgba(111, 92, 231, 0.18);
    }

    .welcome h1 {
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.1;
        letter-spacing: -1.4px;
        background: linear-gradient(135deg, var(--text) 40%, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .welcome p {
        margin: 12px auto 0;
        max-width: 560px;
        color: var(--text-soft);
        font-size: 14px;
        line-height: 1.65;
    }

    .suggestions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-width: 650px;
        margin: 30px auto 0;
    }

    .suggestion {
        padding: 15px 16px;
        border-radius: 15px;
        text-align: left;
        background: var(--glass);
        border: 1px solid var(--border-light);
        color: var(--text-soft);
        font-size: 12px;
        line-height: 1.45;
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
    }

    .suggestion::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0;
        transform: scaleX(0.4);
        transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .suggestion:hover {
        background: rgba(255, 255, 255, 0.88);
        transform: translateY(-2px);
        color: var(--text);
        box-shadow: 0 10px 24px rgba(55, 48, 39, 0.08);
    }

    .suggestion:hover::after {
        opacity: 1;
        transform: scaleX(1);
    }

    .suggestion:active {
        transform: translateY(0) scale(0.99);
    }

    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
        max-width: 820px;
        margin: 0 auto 20px;
        display: flex;
        gap: 10px;
        align-items: flex-start;
    }

    .message.user {
        justify-content: flex-end;
    }

    .message-avatar {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(232, 224, 211, 0.75));
        border: 1px solid var(--border-light);
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        overflow: visible;
        box-shadow: var(--shadow-sm);
        transition: transform 0.25s var(--ease-spring);
    }

    .message.assistant:hover .message-avatar {
        transform: scale(1.08) rotate(-4deg);
    }

    .message.user .message-avatar {
        display: none;
    }

    .message-content {
        min-width: 0;
        max-width: min(760px, 88%);
    }

    .message-bubble {
        padding: 12px 15px;
        border-radius: 17px;
        font-size: 14px;
        line-height: 1.65;
        overflow-wrap: anywhere;
    }

    .message.assistant .message-bubble {
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.72);
        color: var(--text);
        box-shadow: 0 2px 10px rgba(55, 48, 39, 0.03);
    }

    .message.user .message-bubble {
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        color: #fff;
        border-bottom-right-radius: 5px;
        box-shadow: 0 6px 18px rgba(111, 92, 231, 0.22);
    }

    .message-bubble a {
        color: var(--accent-dark);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
        transition: color 0.15s ease;
    }

    .message-bubble a:hover {
        color: var(--accent);
    }

    .message.user .message-bubble a {
        color: #fff;
    }

    /* =====================================================
       MESSAGE EDIT
    ===================================================== */

    .message-actions {
        display: flex;
        gap: 6px;
        margin-top: 5px;
        justify-content: flex-end;
        opacity: 0;
        transform: translateY(2px);
        transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .message:hover .message-actions,
    .message:focus-within .message-actions {
        opacity: 1;
        transform: translateY(0);
    }

    .message-edit-btn {
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 7px;
        cursor: pointer;
        border: 1px solid transparent;
    }

    .message-edit-btn:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--text);
        border-color: rgba(55, 48, 39, 0.06);
    }

    .message.user .message-edit-btn {
        color: rgba(255, 255, 255, 0.8);
    }

    .message.user .message-edit-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.12);
    }

    /* =====================================================
       SOURCES
    ===================================================== */

    .sources {
        margin-top: 11px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-width: 100%;
    }

    .sources-title {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: 0.65px;
        cursor: pointer;
        user-select: none;
        padding: 4px 0;
        border-radius: 6px;
        transition: color 0.15s ease;
    }

    .sources-title:hover {
        color: var(--text-soft);
    }

    .sources-title-line {
        height: 1px;
        flex: 1;
        background: rgba(55, 48, 39, 0.08);
    }

    .sources-toggle {
        font-size: 11px;
        line-height: 1;
        color: var(--muted);
        transition: transform 0.25s var(--ease);
        flex-shrink: 0;
    }

    .sources.open .sources-toggle {
        transform: rotate(180deg);
    }

    .source-list {
        display: none;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        animation: fade-slide-in 0.25s var(--ease) both;
    }

    .sources.open .source-list {
        display: grid;
    }

    .source-card {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        border-radius: 11px;
        background: var(--source-bg);
        border: 1px solid rgba(55, 48, 39, 0.08);
        color: var(--text);
        text-decoration: none;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.18s var(--ease), box-shadow 0.18s ease;
    }

    .source-card:hover {
        background: var(--source-hover);
        border-color: rgba(111, 92, 231, 0.2);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(55, 48, 39, 0.06);
    }

    .source-icon {
        width: 27px;
        height: 27px;
        flex: 0 0 27px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        transition: transform 0.2s var(--ease-spring);
    }

    .source-card:hover .source-icon {
        transform: scale(1.08) rotate(-6deg);
    }

    .source-info {
        min-width: 0;
        flex: 1;
    }

    .source-name {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 11px;
        font-weight: 650;
    }

    .source-domain {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--muted);
        font-size: 9px;
    }

    .source-arrow {
        color: var(--muted);
        font-size: 12px;
        flex-shrink: 0;
        transition: transform 0.2s var(--ease);
    }

    .source-card:hover .source-arrow {
        transform: translateX(2px);
        color: var(--accent);
    }

    /* =====================================================
       MATH
    ===================================================== */

    .math-display {
        width: 100%;
        margin: 15px 0;
        padding: 10px 4px;
        overflow-x: auto;
        overflow-y: hidden;
        text-align: center;
        border-radius: 10px;
    }

    .math-inline {
        display: inline;
    }

    .math-inline mjx-container {
        display: inline-block !important;
    }

    .message-bubble mjx-container {
        color: inherit !important;
    }

    .message-bubble mjx-container[display="true"] {
        margin: 12px 0 !important;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 3px 0;
    }

    .message-bubble mjx-container {
        font-size: 103% !important;
    }

    .message.user mjx-container {
        color: #fff !important;
    }

    /* =====================================================
       CODE
    ===================================================== */

    .code-wrapper {
        width: 100%;
        margin: 13px 0;
        overflow: hidden;
        border-radius: 13px;
        background: #25231f;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 5px 18px rgba(30, 27, 23, 0.12);
        text-align: left;
    }

    .code-header {
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 5px 7px 5px 12px;
        background: #2d2a25;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .code-language {
        min-width: 0;
        color: rgba(238, 234, 226, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        text-transform: lowercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .copy-code {
        min-width: 54px;
        min-height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 10px;
        flex-shrink: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.09);
        color: rgba(238, 234, 226, 0.88);
        font-size: 10px;
        font-weight: 650;
    }

    .copy-code:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        transform: scale(1.03);
    }

    .copy-code.copied {
        background: rgba(111, 92, 231, 0.4);
        color: #fff;
    }

    .copy-code.failed {
        background: rgba(217, 85, 85, 0.28);
        color: #fff;
    }

    .code {
        display: block;
        width: 100%;
        margin: 0;
        padding: 14px;
        overflow-x: auto;
        background: #25231f;
        color: #eeeae2;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre;
        tab-size: 4;
    }

    .inline-code {
        display: inline;
        padding: 2px 5px;
        border-radius: 5px;
        background: rgba(80, 70, 60, 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
    }

    .message-bubble strong {
        font-weight: 750;
    }

    /* =====================================================
       IMAGE
    ===================================================== */

    .message-image {
        display: block;
        width: auto;
        max-width: min(420px, 100%);
        max-height: 420px;
        margin-top: 9px;
        border-radius: 14px;
        border: 1px solid rgba(55, 48, 39, 0.08);
        object-fit: contain;
        background: rgba(255, 255, 255, 0.4);
        transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .message-image:hover {
        transform: scale(1.01);
        box-shadow: 0 10px 28px rgba(55, 48, 39, 0.1);
    }

    .message-meta {
        margin-top: 5px;
        font-size: 10px;
        color: var(--muted);
    }

    .message.user .message-meta {
        text-align: right;
    }

    /* =====================================================
       ATTACHMENT
    ===================================================== */

    .attachment {
        display: none;
        position: fixed;
        left: calc(var(--sidebar) + 20px);
        right: 20px;
        bottom: 96px;
        max-width: 760px;
        margin: 0 auto;
        z-index: 15;
        animation: attachment-in 0.3s var(--ease) both;
    }

    @keyframes attachment-in {
        from { opacity: 0; transform: translateY(10px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .attachment.show {
        display: block;
    }

    .attachment-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        max-width: 100%;
        padding: 9px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .attachment-image {
        width: 52px;
        height: 52px;
        object-fit: cover;
        border-radius: 11px;
    }

    .attachment-file-icon {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.3px;
    }

    .attachment-info {
        min-width: 0;
        max-width: 220px;
    }

    .attachment-name {
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .attachment-mode {
        margin-top: 3px;
        font-size: 10px;
        color: var(--muted);
    }

    .attachment-remove {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: rgba(217, 85, 85, 0.1);
        color: var(--danger);
        font-size: 17px;
    }

    .attachment-remove:hover {
        background: rgba(217, 85, 85, 0.18);
        transform: scale(1.08);
    }

    .attachment-remove:active {
        transform: scale(0.94);
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer-area {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px max(18px, 4vw) calc(14px + env(safe-area-inset-bottom));
        pointer-events: none;
    }

    .composer {
        width: min(820px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 9px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
        backdrop-filter: blur(14px) saturate(1.15);
        -webkit-backdrop-filter: blur(14px) saturate(1.15);
        pointer-events: auto;
        transition: box-shadow 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .composer:focus-within {
        border-color: rgba(111, 92, 231, 0.22);
        box-shadow: 0 14px 40px rgba(55, 48, 39, 0.12), 0 0 0 3px rgba(111, 92, 231, 0.08);
    }

    .composer-button {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        background: rgba(245, 241, 234, 0.85);
        border: 1px solid rgba(55, 48, 39, 0.07);
        color: var(--text-soft);
        font-size: 18px;
    }

    .composer-button .attach-icon {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        transition: transform 0.25s var(--ease-spring);
    }

    .composer-button .attach-icon svg {
        width: 18px;
        height: 18px;
    }

    .composer-button:hover {
        background: #fff;
        color: var(--accent);
        transform: scale(1.05);
        box-shadow: 0 4px 12px rgba(55, 48, 39, 0.06);
    }

    .composer-button:hover .attach-icon {
        transform: rotate(-12deg) scale(1.08);
    }

    .composer-button:active {
        transform: scale(0.96);
    }

    .composer-button.active {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: rgba(111, 92, 231, 0.18);
        box-shadow: 0 0 0 3px rgba(111, 92, 231, 0.06);
    }

    .composer-center {
        min-width: 0;
        flex: 1;
    }

    .mode-row {
        display: none;
        gap: 6px;
        margin: 0 0 7px;
        animation: fade-slide-in 0.25s var(--ease) both;
    }

    .mode-row.show {
        display: flex;
    }

    .mode-button {
        padding: 6px 11px;
        border-radius: 9px;
        background: rgba(80, 70, 60, 0.06);
        color: var(--text-soft);
        font-size: 10px;
        font-weight: 650;
        border: 1px solid transparent;
    }

    .mode-button:hover {
        background: rgba(80, 70, 60, 0.1);
        color: var(--text);
    }

    .mode-button.active {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: rgba(111, 92, 231, 0.15);
        box-shadow: 0 2px 8px rgba(111, 92, 231, 0.1);
    }

    textarea {
        width: 100%;
        min-height: 42px;
        max-height: 140px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        padding: 10px 4px;
        font-size: 14px;
        line-height: 1.45;
    }

    textarea::placeholder {
        color: #9a948a;
    }

    .send-button {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        color: #fff;
        font-size: 16px;
        box-shadow: 0 6px 16px rgba(111, 92, 231, 0.28);
        position: relative;
        overflow: hidden;
    }

    .send-button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.22), transparent);
        transform: translateX(-100%);
        transition: transform 0.45s var(--ease);
    }

    .send-button:hover:not(:disabled) {
        background: linear-gradient(145deg, #7a67ef, var(--accent));
        transform: scale(1.06);
        box-shadow: 0 8px 22px rgba(111, 92, 231, 0.35);
    }

    .send-button:hover:not(:disabled)::before {
        transform: translateX(100%);
    }

    .send-button:active:not(:disabled) {
        transform: scale(0.96);
    }

    .send-button:disabled {
        opacity: 0.45;
        cursor: default;
        box-shadow: none;
    }

    .composer-hint {
        width: min(820px, 100%);
        margin: 8px auto 0;
        text-align: center;
        font-size: 9px;
        color: rgba(98, 94, 86, 0.72);
        pointer-events: auto;
    }

    #fileInput,
    #galleryInput {
        display: none;
    }

    /* =====================================================
       ATTACH MENU (Gallery / File)
    ===================================================== */

    .attach-menu {
        display: none;
        position: absolute;
        left: 9px;
        bottom: calc(100% + 10px);
        z-index: 25;
        min-width: 168px;
        padding: 6px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border-light);
        box-shadow: var(--shadow-md);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: fade-slide-in 0.22s var(--ease) both;
    }

    .attach-menu.show {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .attach-menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 11px;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        border: 1px solid transparent;
    }

    .attach-menu-item:hover {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: rgba(111, 92, 231, 0.12);
    }

    .attach-menu-item:active {
        transform: scale(0.98);
    }

    .attach-menu-icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: rgba(80, 70, 60, 0.06);
        font-size: 14px;
        flex-shrink: 0;
    }

    .attach-menu-item:hover .attach-menu-icon {
        background: rgba(111, 92, 231, 0.14);
    }

    .composer {
        position: relative;
    }


    /* =====================================================
       PINGU AI AVATAR / MOTION — enhanced
    ===================================================== */

    .pingu-visual {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
        transform-origin: 50% 72%;
        will-change: transform;
    }

    .pingu-visual .pingu-head,
    .pingu-visual .pingu-wing-left,
    .pingu-visual .pingu-wing-right,
    .pingu-visual .pingu-eye,
    .pingu-visual .pingu-pencil,
    .pingu-visual .pingu-body {
        transform-box: fill-box;
    }

    .pingu-visual .pingu-head { transform-origin: 50% 70%; }
    .pingu-visual .pingu-wing-left,
    .pingu-visual .pingu-wing-right { transform-origin: 50% 35%; }
    .pingu-visual .pingu-eye { transform-origin: center; }
    .pingu-visual .pingu-pencil {
        transform-origin: 10% 90%;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .pingu-visual .pingu-body { transform-origin: 50% 60%; }

    .pingu-visual.idle {
        animation: pingu-idle 5.2s ease-in-out infinite;
    }

    .pingu-visual.thinking {
        animation: pingu-think 1.7s ease-in-out infinite;
    }

    .pingu-visual.writing {
        animation: pingu-writing 1.25s ease-in-out infinite;
    }

    .pingu-visual.writing .pingu-head {
        animation: pingu-head-write 1.25s ease-in-out infinite;
    }

    .pingu-visual.writing .pingu-wing-right {
        animation: pingu-write-wing 0.65s ease-in-out infinite;
    }

    .pingu-visual.writing .pingu-wing-left {
        animation: pingu-support-wing 1.25s ease-in-out infinite;
    }

    .pingu-visual.writing .pingu-pencil {
        opacity: 1;
        animation: pingu-pencil 0.65s ease-in-out infinite;
    }

    .pingu-visual.thinking .pingu-head {
        animation: pingu-head-think 1.7s ease-in-out infinite;
    }

    .pingu-visual.thinking .pingu-wing-left {
        animation: pingu-think-wing-l 1.7s ease-in-out infinite;
    }

    .pingu-visual.thinking .pingu-wing-right {
        animation: pingu-think-wing-r 1.7s ease-in-out infinite;
    }

    .pingu-visual.idle .pingu-eye,
    .pingu-visual.thinking .pingu-eye,
    .pingu-visual.writing .pingu-eye {
        animation: pingu-blink 5.2s ease-in-out infinite;
    }

    .pingu-visual.idle .pingu-wing-left {
        animation: pingu-idle-wing-l 5.2s ease-in-out infinite;
    }

    .pingu-visual.idle .pingu-wing-right {
        animation: pingu-idle-wing-r 5.2s ease-in-out infinite;
    }

    @keyframes pingu-idle {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        20% { transform: translate3d(0, -2.5px, 0) rotate(-1.2deg); }
        40% { transform: translate3d(0, -4px, 0) rotate(0.3deg); }
        60% { transform: translate3d(0, -2px, 0) rotate(1.1deg); }
        80% { transform: translate3d(0, -3px, 0) rotate(-0.4deg); }
    }

    @keyframes pingu-idle-wing-l {
        0%, 100% { transform: rotate(-2deg); }
        50% { transform: rotate(4deg) translateY(1px); }
    }

    @keyframes pingu-idle-wing-r {
        0%, 100% { transform: rotate(2deg); }
        50% { transform: rotate(-5deg) translateY(1px); }
    }

    @keyframes pingu-think {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(-1.5deg) scale(1); }
        50% { transform: translate3d(0, -3px, 0) rotate(1.8deg) scale(1.025); }
    }

    @keyframes pingu-think-wing-l {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(10deg); }
    }

    @keyframes pingu-think-wing-r {
        0%, 100% { transform: rotate(4deg); }
        50% { transform: rotate(-8deg); }
    }

    @keyframes pingu-writing {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(-1deg); }
        25% { transform: translate3d(0, -1.5px, 0) rotate(0.6deg); }
        50% { transform: translate3d(0, 1.5px, 0) rotate(1.2deg); }
        75% { transform: translate3d(0, -1px, 0) rotate(-0.3deg); }
    }

    @keyframes pingu-head-write {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(1.5px); }
    }

    @keyframes pingu-head-think {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-5deg); }
        70% { transform: rotate(3deg); }
    }

    @keyframes pingu-write-wing {
        0%, 100% { transform: rotate(8deg) translate(0, 0); }
        50% { transform: rotate(-16deg) translate(-3px, 3px); }
    }

    @keyframes pingu-support-wing {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(7deg); }
    }

    @keyframes pingu-pencil {
        0%, 100% { transform: rotate(-10deg) translate(0, 0); }
        50% { transform: rotate(12deg) translate(-3px, 3px); }
    }

    @keyframes pingu-blink {
        0%, 90%, 100% { transform: scaleY(1); }
        92% { transform: scaleY(0.08); }
        94% { transform: scaleY(1); }
        96% { transform: scaleY(0.12); }
        98% { transform: scaleY(1); }
    }

    .message.assistant {
        animation: assistant-in 0.38s var(--ease) both;
    }

    .message.assistant .message-bubble {
        transition: transform 0.22s var(--ease), box-shadow 0.22s var(--ease), background 0.22s ease;
    }

    .message.assistant:hover .message-bubble {
        transform: translateY(-1px);
        box-shadow: 0 10px 26px rgba(55, 48, 39, 0.06);
    }

    .welcome-logo,
    .message-avatar,
    .typing-avatar {
        overflow: visible;
    }

    @keyframes assistant-in {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fade-slide-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .pingu-visual,
        .pingu-visual *,
        .message.assistant,
        .typing-dots span,
        .status-dot,
        .welcome,
        .history-item-wrap,
        .attachment {
            animation: none !important;
        }

        button,
        .suggestion,
        .source-card,
        .message-bubble,
        .composer {
            transition: none !important;
        }
    }

    /* =====================================================
       TYPING
    ===================================================== */

    .typing {
        display: none;
        max-width: 820px;
        margin: 0 auto 18px;
        align-items: center;
        gap: 10px;
        animation: fade-slide-in 0.3s var(--ease) both;
    }

    .typing.show {
        display: flex;
    }

    .typing-avatar {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(232, 224, 211, 0.75));
        border: 1px solid var(--border-light);
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        box-shadow: 0 6px 16px rgba(55, 48, 39, 0.08);
        overflow: visible;
    }

    .typing-label {
        font-size: 11px;
        color: var(--muted);
        margin-right: 2px;
        white-space: nowrap;
    }

    .typing-dots {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px 11px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.62);
        box-shadow: var(--shadow-sm);
    }

    .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8d877d;
        animation: typing 1.05s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
        animation-delay: 0.14s;
    }

    .typing-dots span:nth-child(3) {
        animation-delay: 0.28s;
    }

    @keyframes typing {
        0%, 60%, 100% {
            transform: translateY(0);
            opacity: 0.35;
        }
        30% {
            transform: translateY(-4px);
            opacity: 1;
        }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 720px) {
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            transform: translateX(-100%);
            transition: transform 0.28s var(--ease);
            background: rgba(250, 247, 241, 0.96);
            box-shadow: 10px 0 36px rgba(40, 35, 30, 0.1);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .mobile-menu {
            display: grid;
        }

        .topbar {
            min-height: 58px;
            padding: 0 12px;
        }

        .chat-container {
            padding: 22px 13px 165px;
        }

        .welcome {
            margin-top: 7vh;
        }

        .welcome h1 {
            font-size: 30px;
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
        }

        .suggestions {
            grid-template-columns: 1fr;
            margin-top: 24px;
        }

        .message-content {
            max-width: 91%;
        }

        .attachment {
            left: 12px;
            right: 12px;
            bottom: 94px;
        }

        .composer-area {
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        }

        .composer {
            border-radius: 18px;
        }

        .composer-hint {
            display: none;
        }

        .code {
            font-size: 11px;
            padding: 12px;
        }

        .message-bubble mjx-container {
            font-size: 96% !important;
        }

        .history-close {
            width: 32px;
            height: 32px;
        }

        .source-list {
            grid-template-columns: 1fr;
        }

        .composer-button,
        .send-button {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
        }
    }

/* =========================================================
   PINGU AI — PREMIUM DARK REDESIGN
   UI-only override. Existing application logic is preserved.
========================================================= */

:root {
    --bg: #07090d;
    --bg-soft: #0b0e14;
    --glass: rgba(17, 21, 29, 0.72);
    --glass-strong: rgba(20, 24, 33, 0.92);
    --glass-soft: rgba(15, 19, 27, 0.55);
    --border: rgba(255,255,255,0.075);
    --border-light: rgba(255,255,255,0.10);
    --text: #f3f6fb;
    --text-soft: #aab2c0;
    --muted: #697384;
    --accent: #7c6cff;
    --accent-dark: #5b4be2;
    --accent-soft: rgba(124,108,255,0.12);
    --accent-glow: rgba(124,108,255,0.22);
    --danger: #ff6b75;
    --success: #62d58b;
    --source-bg: rgba(18,23,32,0.78);
    --source-hover: rgba(27,33,45,0.92);
    --sidebar: 264px;
    --shadow-sm: 0 5px 18px rgba(0,0,0,.18);
    --shadow-md: 0 14px 38px rgba(0,0,0,.28);
    --shadow-lg: 0 22px 60px rgba(0,0,0,.38);
}

html, body {
    background: #07090d;

        .map(source => {  
  
            if (

/* =========================================================  
   URL / SOURCE HELPERS  
========================================================= */  
  
function isValidHttpUrl(value) {  
  
    try {  
  
        const url =  
            new URL(  
                String(value)  
            );  
  
        return (  
            url.protocol ===  
                "http:" ||  
            url.protocol ===  
                "https:"  
        );  
  
    } catch {  
  
        return false;  
    }  
}  
  
  
function cleanUrl(value) {  
  
    let url =  
        String(  
            value || ""  
        ).trim();  
  
    url =  
        url.replace(  
            /[),.;!?]+$/g,  
            ""  
        );  
  
    return url;  
}  
  
  
function getDomainName(url) {  
  
    try {  
  
        const parsed =  
            new URL(  
                url  
            );  
  
        return parsed.hostname  
            .replace(  
                /^www\./,  
                ""  
            );  
  
    } catch {  
  
        return "Sumber";  
    }  
}  
  
  
function getSourceTitle(url) {  
  
    const domain =  
        getDomainName(  
            url  
        );  
  
    if (  
        domain ===  
        "kompas.tv"  
    ) {  
  
        return "Kompas TV";  
  
    }  
  
    if (  
        domain ===  
        "youtube.com" ||  
        domain ===  
        "youtu.be"  
    ) {  
  
        return "YouTube";  
  
    }  
  
    if (  
        domain ===  
        "wikipedia.org"  
    ) {  
  
        return "Wikipedia";  
  
    }  
  
    if (  
        domain ===  
        "github.com"  
    ) {  
  
        return "GitHub";  
    }  
  
    return domain;  
}  
  
  
/*  
 * Mengambil URL dari teks AI.  
 */  
function extractUrls(text) {  
  
    const source =  
        String(  
            text || ""  
        );  
  
    const matches =  
        source.match(  
            /https?:\/\/[^\s<>"']+/gi  
        ) || [];  
  
    const unique =  
        [];  
  
    for (  
        const raw of matches  
    ) {  
  
        const url =  
            cleanUrl(  
                raw  
            );  
  
        if (  
            !isValidHttpUrl(  
                url  
            )  
        ) {  
            continue;  
        }  
  
        if (  
            !unique.some(  
                item =>  
                    item.url ===  
                    url  
            )  
        ) {  
  
            unique.push({  
  
                title:  
                    getSourceTitle(  
                        url  
                    ),  
  
                url:  
                    url  
            });  
        }  
    }  
  
    return unique.slice(  
        0,  
        12  
    );  
}  
  
  
/*  
 * Mengambil sumber dari beberapa  
 * kemungkinan struktur response API.  
 */  
function extractSources(data) {  
  
    if (!data) {  
        return [];  
    }  
  
    const candidates = [];  
  
    if (  
        Array.isArray(  
            data.sources  
        )  
    ) {  
  
        candidates.push(  
            ...data.sources  
        );  
    }  
  
    if (  
        Array.isArray(  
            data.references  
        )  
    ) {  
  
        candidates.push(  
            ...data.references  
        );  
    }  
  
    if (  
        Array.isArray(  
            data.citations  
        )  
    ) {  
  
        candidates.push(  
            ...data.citations  
        );  
    }  
  
    if (  
        data.source &&  
        typeof data.source ===  
            "object"  
    ) {  
  
        candidates.push(  
            data.source  
        );  
    }  
  
    const normalized =  
        normalizeSources(  
            candidates  
        );  
  
    const replyUrls =  
        extractUrls(  
            data.reply ||  
            data.text ||  
            data.content ||  
            ""  
        );  
  
    const combined =  
        [  
            ...normalized,  
            ...replyUrls  
        ];  
  
    const unique =  
        [];  
  
    for (  
        const item of combined  
    ) {  
  
        if (  
            !unique.some(  
                source =>  
                    source.url ===  
                    item.url  
            )  
        ) {  
  
            unique.push(  
                item  
            );  
        }  
    }  
  
    return unique.slice(  
        0,  
        12  
    );  
}  
  
  
/* =========================================================  
   HTML  
========================================================= */  
  
function escapeHTML(value) {  
  
    return String(  
        value ?? ""  
    )  
        .replace(  
            /&/g,  
            "&amp;"  
        )  
        .replace(  
            /</g,  
            "&lt;"  
        )  
        .replace(  
            />/g,  
            "&gt;"  
        )  
        .replace(  
            /"/g,  
            "&quot;"  
        )  
        .replace(  
            /'/g,  
            "&#039;"  
        );  
}  
  
  
/*  
 * Escape URL sebelum dimasukkan  
 * ke atribut HTML.  
 */  
function safeHref(url) {  
  
    const clean =  
        cleanUrl(  
            url  
        );  
  
    if (  
        !isValidHttpUrl(  
            clean  
        )  
    ) {  
  
        return "#";  
    }  
  
    return escapeHTML(  
        clean  
    );  
}  
  
  
/* =========================================================  
   MARKDOWN LINKS  
========================================================= */  
  
function renderMarkdownLinks(  
    text  
) {  
  
    return text.replace(  
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,  
        (  
            _,  
            title,  
            url  
        ) => {  
  
            const safe =  
                safeHref(  
                    url  
                );  
  
            if (  
                safe === "#"  
            ) {  
  
                return escapeHTML(  
                    title  
                );  
            }  
  
            return `  
                <a  
                    href="${safe}"  
                    target="_blank"  
                    rel="noopener noreferrer"  
                >${escapeHTML(title)}</a>  
            `;  
        }  
    );  
}  
  
  
/* =========================================================  
   MATH  
========================================================= */  
  
function extractMathBlocks(  
    source,  
    blocks  
) {  
  
    source =  
        source.replace(  
            /\$\$([\s\S]*?)\$\$/g,  
            (_, math) => {  
  
                const index =  
                    blocks.length;  
  
                blocks.push({  
  
                    type:  
                        "display-math",  
  
                    content:  
                        String(  
                            math || ""  
                        ).trim()  
                });  
  
                return `  
                    __PINGU_MATH_BLOCK_${index}__  
                `;  
            }  
        );  
  
    source =  
        source.replace(  
            /\\\[([\s\S]*?)\\\]/g,  
            (_, math) => {  
  
                const index =  
                    blocks.length;  
  
                blocks.push({  
  
                    type:  
                        "display-math",  
  
                    content:  
                        String(  
                            math || ""  
                        ).trim()  
                });  
  
                return `  
                    __PINGU_MATH_BLOCK_${index}__  
                `;  
            }  
        );  
  
    source =  
        source.replace(  
            /\\\(([\s\S]*?)\\\)/g,  
            (_, math) => {  
  
                const index =  
                    blocks.length;  
  
                blocks.push({  
  
                    type:  
                        "inline-math",  
  
                    content:  
                        String(  
                            math || ""  
                        ).trim()  
                });  
  
                return `  
                    __PINGU_MATH_BLOCK_${index}__  
                `;  
            }  
        );  
  
    source =  
        source.replace(  
            /(^|[^\$])\$([^\$\n]+)\$(?!\$)/g,  
            (  
                full,  
                before,  
                math  
            ) => {  
  
                const index =  
                    blocks.length;  
  
                blocks.push({  
  
                    type:  
                        "inline-math",  
  
                    content:  
                        String(  
                            math || ""  
                        ).trim()  
                });  
  
                return (  
                    before +  
                    `__PINGU_MATH_BLOCK_${index}__`  
                );  
            }  
        );  
  
    return source;  
}  
  
  
/* =========================================================  
   NORMAL TEXT  
========================================================= */  
  
function formatNormalText(  
    text  
) {  
  
    if (!text) {  
        return "";  
    }  
  
    let output =  
        escapeHTML(  
            text  
        );  
  
    output =  
        output.replace(  
            /`([^`\n]+)`/g,  
            '<span class="inline-code">$1</span>'  
        );  
  
    output =  
        output.replace(  
            /\*\*([^*\n]+)\*\*/g,  
            "<strong>$1</strong>"  
        );  
  
    /*  
     * URL langsung menjadi link.  
     */  
    output =  
        output.replace(  
            /(https?:\/\/[^\s<>"']+)/gi,  
            raw => {  
  
                const url =  
                    cleanUrl(  
                        raw  
                    );  
  
                const safe =  
                    safeHref(  
                        url  
                    );  
  
                if (  
                    safe === "#"  
                ) {  
  
                    return raw;  
                }  
  
                const label =  
                    escapeHTML(  
                        getDomainName(  
                            url  
                        )  
                    );  

                return `  
                    <a  
                        href="${safe}"  
                        target="_blank"  
                        rel="noopener noreferrer"  
                    >${label}</a>  
                `;  
            }  
        );  
  
    output =  
        output.replace(  
            /\r?\n/g,  
            "<br>"  
        );  
  
    return output;  
}  
  
  
/* =========================================================  
   FORMAT TEXT  
========================================================= */  
  
function formatText(  
    text  
) {  
  
    let source =  
        String(  
            text ?? ""  
        );  
  
    /*  
     * Buang tag HTML mentah dari model  
     * agar tidak tampil sebagai script.  
     */  
    source =  
        source.replace(  
            /<\s*\/?\s*[a-zA-Z][^>]*>/g,  
            ""  
        );  

    /*  
     * Perbaiki markdown link yang putus baris.  
     */  
    source =  
        source.replace(  
            /\[([^\]\n]{1,200})\]\s*\n+\s*\((https?:\/\/[^\s)]+)\)/g,  
            "[$1]($2)"  
        );  

    const blocks = [];  
  
  
    /*  
     * Code block.  
     */  
    source =  
        source.replace(  
            /```[ \t]*([a-zA-Z0-9_+#.-]*)[ \t]*\r?\n([\s\S]*?)```/g,  
            (  
                _,  
                language,  
                code  
            ) => {  
  
                const index =  
                    blocks.length;  
  
                blocks.push({  
  
                    type:  
                        "code",  
  
                    language:  
                        String(  
                            language || ""  
                        ).trim() ||  
                        "code",  
  
                    content:  
                        String(  
                            code || ""  
                        ).replace(  
                            /\r?\n$/,  
                            ""  
                        )  
  
                });  
  
                return `  
                    __PINGU_CODE_BLOCK_${index}__  
                `;  
            }  
        );  
  
  
    /*  
     * Markdown links sebelum  
     * escape HTML.  
     */  
    source =  
        source.replace(  
            /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,  
            (  
                _,  
                title,  
                url  
            ) => {  
  
                const index =  
                    blocks.length;  
  
                blocks.push({  
  
                    type:  
                        "link",  
  
                    title:  
                        title,  
  
                    url:  
                        cleanUrl(  
                            url  
                        )  
  
                });  
  
                return `  
                    __PINGU_LINK_BLOCK_${index}__  
                `;  
            }  
        );  
  
  
    /*  
     * Math.  
     */  
    source =  
        extractMathBlocks(  
            source,  
            blocks  
        );  
  
  
    let output =  
        formatNormalText(  
            source  
        );  
  
  
    /*  
     * Render semua placeholder.  
     */  
    for (  
        let i = 0;  
        i < blocks.length;  
        i++  
    ) {  
  
        const block =  
            blocks[i];  
  
        const codePlaceholder =  
            `__PINGU_CODE_BLOCK_${i}__`;  
  
        const mathPlaceholder =  
            `__PINGU_MATH_BLOCK_${i}__`;  
  
        const linkPlaceholder =  
            `__PINGU_LINK_BLOCK_${i}__`;  
  
  
        if (  
            block.type ===  
            "code"  
        ) {  
  
            output =  
                output.replace(  
                    codePlaceholder,  
                    `  
                    <div class="code-wrapper">  
  
                        <div class="code-header">  
  
                            <span class="code-language">  
                                ${escapeHTML(  
                                    block.language  
                                )}  
                            </span>  
  
                            <button  
                                class="copy-code"  
                                type="button"  
                            >  
                                Salin  
                            </button>  
  
                        </div>  
  
                        <pre class="code"><code>${escapeHTML(  
                            block.content  
                        )}</code></pre>  </div>  
                `  
            );  

    } else if (  
        block.type ===  
        "display-math"  
    ) {  

        output =  
            output.replace(  
                mathPlaceholder,  
                `<div class="math-display" data-math-index="${i}"></div>`  
            );  

    } else if (  
        block.type ===  
        "inline-math"  
    ) {  

        output =  
            output.replace(  
                mathPlaceholder,  
                `<span class="math-inline" data-math-index="${i}"></span>`  
            );  

    } else if (  
        block.type ===  
        "link"  
    ) {  

        const safe =  
            safeHref(  
                block.url  
            );  

        if (  
            safe === "#"  
        ) {  

            output =  
                output.replace(  
                    linkPlaceholder,  
                    escapeHTML(  
                        block.title  
                    )  
                );  

        } else {  

            output =  
                output.replace(  
                    linkPlaceholder,  
                    `  
                    <a  
                        href="${safe}"  
                        target="_blank"  
                        rel="noopener noreferrer"  
                    >${escapeHTML(  
                        block.title  
                    )}</a>  
                    `  
                );  
        }  
    }  
}  


return {  

    html:  
        output,  

    blocks  
};

}

/* =========================================================
MATH RENDER
========================================================= */

function renderMathBlocks(
bubble,
blocks
) {

if (!bubble) {  
    return;  
}  

bubble  
    .querySelectorAll(  
        "[data-math-index]"  
    )  
    .forEach(  
        element => {  

            const block =  
                blocks[  
                    Number(  
                        element.dataset  
                            .mathIndex  
                    )  
                ];  

            if (!block) {  
                return;  
            }  

            if (  
                block.type ===  
                "display-math"  
            ) {  

                element.textContent =  
                    "\\[" +  
                    block.content +  
                    "\\]";  

            } else {  

                element.textContent =  
                    "\\(" +  
                    block.content +  
                    "\\)";  
            }  
        }  
    );

}

async function typesetMath(
element
) {

if (!element) {  
    return;  
}  

try {  

    if (!window.MathJax) {  
        return;  
    }  

    if (  
        window.MathJax.startup &&  
        window.MathJax.startup.promise  
    ) {  

        await window.MathJax  
            .startup  
            .promise;  
    }  

    if (  
        typeof  
            window.MathJax.typesetPromise ===  
            "function"  
    ) {  

        await window.MathJax  
            .typesetPromise(  
                [element]  
            );  
    }  

} catch (error) {  

    console.warn(  
        "MathJax gagal:",  
        error  
    );  
}

}

const TEXT_FILE_EXTENSIONS = new Set(["txt","md","csv","json","xml","html","htm","css","js","mjs","cjs","ts","tsx","jsx","py","java","c","cpp","h","hpp","php","sql","sh","bash","yml","yaml","log","ini","toml","env"]);
function getFileExtension(name){const v=String(name||"").toLowerCase(),i=v.lastIndexOf(".");return i===-1?"":v.slice(i+1)}
function isTextFile(file){return !!file && (file.type.startsWith("text/") || TEXT_FILE_EXTENSIONS.has(getFileExtension(file.name)) || ["application/json","application/javascript","application/xml"].includes(file.type))}
function formatFileSize(bytes){if(bytes<1024)return `${bytes} B`;if(bytes<1048576)return `${(bytes/1024).toFixed(1)} KB`;return `${(bytes/1048576).toFixed(1)} MB`}
function showGenericFile(file,base64,textContent=null){attachedFile={name:file.name,mimeType:file.type||"application/octet-stream",size:file.size,data:base64,textContent};attachedImage=null;if(attachedImagePreview){URL.revokeObjectURL(attachedImagePreview);attachedImagePreview=null}elements.attachmentImage.src="";elements.attachmentImage.classList.add("hidden");elements.attachmentFileIcon.classList.remove("hidden");elements.attachmentFileIcon.textContent=(getFileExtension(file.name).toUpperCase().slice(0,5)||"FILE");elements.attachmentName.textContent=`${file.name} • ${formatFileSize(file.size)}`;elements.attachmentMode.textContent=isTextFile(file)?"File teks siap dibaca Pingu":"File terlampir";elements.attachment.classList.add("show");elements.imageButton.classList.add("active");elements.modeRow.classList.remove("show");setMode("chat")}

function fileToBase64(
file
) {

return new Promise(  
    (  
        resolve,  
        reject  
    ) => {  

        const reader =  
            new FileReader();  

        reader.onload =  
            () => {  

                const result =  
                    String(  
                        reader.result ||  
                        ""  
                    );  

                const comma =  
                    result.indexOf(  
                        ","  
                    );  

                resolve(  
                    comma === -1  
                        ? result  
                        : result.slice(  
                            comma + 1  
                        )  
                );  
            };  

        reader.onerror =  
            reject;  

        reader.readAsDataURL(  
            file  
        );  
    }  
);

}

async function handleImage(
file
) {

if (!file) {  
    return;  
}  

if (  
    !file.type.startsWith(  
        "image/"  
    )  
) {  

    alert(  
        "File yang dipilih bukan gambar."  
    );  

    return;  
}  

if (  
    file.size >  
    15 * 1024 * 1024  
) {  

    alert(  
        "Ukuran gambar terlalu besar. Maksimal 15 MB."  
    );  

    return;  
}  

try {  

    const base64 =  
        await fileToBase64(  
            file  
        );  


    if (  
        attachedImagePreview  
    ) {  

        URL.revokeObjectURL(  
            attachedImagePreview  
        );  
    }  


    attachedImage = {  

        mimeType:  
            file.type,  

        data:  
            base64,  

        name:  
            file.name,  

        size:  
            file.size  
    };  


    attachedImagePreview =  
        URL.createObjectURL(  
            file  
        );  


    elements.attachmentImage.src = attachedImagePreview;
elements.attachmentImage.classList.remove("hidden");
elements.attachmentFileIcon.classList.add("hidden");  


    elements  
        .attachmentName  
        .textContent =  
            file.name;  


    elements  
        .attachment  
        .classList  
        .add(  
            "show"  
        );  


    elements  
        .imageButton  
        .classList  
        .add(  
            "active"  
        );  


    elements  
        .modeRow  
        .classList  
        .add(  
            "show"  
        );  


    setMode(  
        "chat"  
    );  

} catch {  

    alert(  
        "Gagal membaca gambar."  
    );  
}

}

/* =========================================================  
   MODEL NAME  
========================================================= */  

function sanitizeModelName(name) {  

    const value =  
        String(  
            name || ""  
        ).trim();  

    if (!value) {  
        return "Pingu AI";  
    }  

    const lower =  
        value.toLowerCase();  

    if (  
        lower.includes("gemini") ||  
        lower.includes("google") ||  
        lower.includes("gpt") ||  
        lower.includes("claude") ||  
        lower.includes("openai") ||  
        lower.includes("anthropic")  
    ) {  
        return "Pingu AI";  
    }  

    return value;  
}

SEND
