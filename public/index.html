<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f4efe6"
    >

    <meta
        name="description"
        content="Pingu AI - AI chat dengan dukungan gambar."
    >

    <title>Pingu AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f4efe6;
            --bg-soft: #faf7f1;

            --glass: rgba(255, 255, 255, .62);
            --glass-strong: rgba(255, 255, 255, .78);
            --glass-soft: rgba(255, 255, 255, .42);

            --border: rgba(55, 48, 39, .10);
            --border-light: rgba(255, 255, 255, .78);

            --text: #292720;
            --text-soft: #625e56;
            --muted: #918b82;

            --accent: #6f5ce7;
            --accent-dark: #5947d0;

            --danger: #d95555;

            --radius: 18px;
            --sidebar: 270px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(255,255,255,.85),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(224,216,201,.55),
                    transparent 32%
                ),
                var(--bg);

            color: var(--text);
            overflow: hidden;
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: var(--sidebar);
            height: 100%;
            padding: 16px;

            display: flex;
            flex-direction: column;
            gap: 14px;

            background: rgba(255,255,255,.34);
            border-right: 1px solid var(--border);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            flex-shrink: 0;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 6px 14px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #e8e0d3
                );

            border: 1px solid var(--border-light);

            box-shadow:
                0 5px 15px rgba(52,43,31,.08);

            font-size: 17px;
            font-weight: 800;
            color: var(--accent);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 750;
            letter-spacing: -.2px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .new-chat {
            width: 100%;
            min-height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border-radius: 14px;

            background: var(--glass-strong);
            border: 1px solid var(--border-light);

            color: var(--text);
            font-weight: 650;

            box-shadow:
                0 5px 18px rgba(55,48,39,.06);

            transition:
                transform .15s ease,
                background .15s ease;
        }

        .new-chat:hover {
            background: rgba(255,255,255,.9);
        }

        .new-chat:active {
            transform: scale(.98);
        }

        .history-title {
            padding: 8px 7px 2px;

            font-size: 11px;
            font-weight: 700;

            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .history {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 2px;
        }

        .history::-webkit-scrollbar {
            width: 4px;
        }

        .history::-webkit-scrollbar-thumb {
            background: rgba(70,60,50,.13);
            border-radius: 20px;
        }

        .history-empty {
            padding: 12px 8px;
            font-size: 12px;
            line-height: 1.5;
            color: var(--muted);
        }

        .history-item {
            width: 100%;

            display: flex;
            align-items: center;

            padding: 10px 11px;
            margin-bottom: 5px;

            border-radius: 12px;

            background: transparent;
            color: var(--text-soft);

            text-align: left;
            font-size: 12px;

            transition:
                background .15s ease,
                color .15s ease;
        }

        .history-item:hover {
            background: rgba(255,255,255,.48);
            color: var(--text);
        }

        .history-item.active {
            background: rgba(255,255,255,.7);
            color: var(--text);
            border: 1px solid rgba(55,48,39,.07);
        }

        .sidebar-footer {
            padding-top: 8px;
            border-top: 1px solid rgba(55,48,39,.07);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px;

            font-size: 11px;
            color: var(--muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #54a86a;
            box-shadow: 0 0 0 3px rgba(84,168,106,.12);
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            min-width: 0;
            height: 100%;
            flex: 1;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        .topbar {
            height: 62px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);

            background: rgba(255,255,255,.28);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mobile-menu {
            display: none;
        }

        .top-title {
            font-size: 15px;
            font-weight: 720;
        }

        .top-model {
            font-size: 11px;
            color: var(--muted);
            margin-top: 1px;
        }

        .chat-container {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding:
                34px
                max(20px, 5vw)
                180px;
        }

        .chat-container::-webkit-scrollbar {
            width: 5px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(60,50,40,.12);
            border-radius: 20px;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            max-width: 760px;
            margin: 8vh auto 0;
            text-align: center;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 17px;

            display: grid;
            place-items: center;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #e8e0d4
                );

            border: 1px solid var(--border-light);

            box-shadow:
                0 10px 28px rgba(55,48,39,.09);

            font-size: 25px;
            font-weight: 850;
            color: var(--accent);
        }

        .welcome h1 {
            font-size: clamp(27px, 5vw, 42px);
            line-height: 1.1;
            letter-spacing: -1.4px;
        }

        .welcome p {
            margin: 12px auto 0;

            max-width: 560px;

            color: var(--text-soft);

            font-size: 14px;
            line-height: 1.6;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0,1fr));

            gap: 10px;

            max-width: 650px;
            margin: 30px auto 0;
        }

        .suggestion {
            padding: 15px;

            border-radius: 15px;

            text-align: left;

            background: var(--glass);
            border: 1px solid var(--border-light);

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.45;

            box-shadow:
                0 5px 18px rgba(55,48,39,.045);

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .suggestion:hover {
            background: rgba(255,255,255,.78);
            transform: translateY(-1px);
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            max-width: 820px;
            margin: 0 auto 20px;

            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            flex: 0 0 30px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background: rgba(255,255,255,.68);
            border: 1px solid var(--border-light);

            color: var(--accent);

            font-size: 11px;
            font-weight: 800;
        }

        .message.user .message-avatar {
            display: none;
        }

        .message-content {
            min-width: 0;
            max-width: min(760px, 88%);
        }

        .message-bubble {
            padding: 12px 15px;

            border-radius: 17px;

            font-size: 14px;
            line-height: 1.65;

            overflow-wrap: anywhere;
        }

        .message.assistant .message-bubble {
            background: rgba(255,255,255,.47);
            border: 1px solid rgba(255,255,255,.68);
            color: var(--text);
        }

        .message.user .message-bubble {
            background: var(--accent);
            color: #fff;

            border-bottom-right-radius: 5px;

            box-shadow:
                0 5px 16px rgba(111,92,231,.16);
        }

        /* =========================
           CODE BLOCK
        ========================= */

        /*
         * Hanya area kode yang gelap.
         * Bubble pesan Pingu tetap cream/transparan.
         */

        .code-wrapper {
            width: 100%;
            margin: 13px 0;

            overflow: hidden;

            border-radius: 13px;

            background: #25231f;

            border: 1px solid rgba(255,255,255,.08);

            box-shadow:
                0 5px 18px rgba(30,27,23,.12);

            text-align: left;
        }

        .code-header {
            min-height: 36px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding: 5px 7px 5px 12px;

            background: #2d2a25;

            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .code-language {
            min-width: 0;

            color: rgba(238,234,226,.62);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 10px;
            text-transform: lowercase;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .copy-code {
            min-width: 52px;
            min-height: 27px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 9px;

            flex-shrink: 0;

            border-radius: 7px;

            background: rgba(255,255,255,.09);

            color: rgba(238,234,226,.88);

            font-size: 10px;
            font-weight: 650;

            cursor: pointer;

            transition:
                background .15s ease,
                color .15s ease,
                transform .1s ease;
        }

        .copy-code:hover {
            background: rgba(255,255,255,.16);
            color: #fff;
        }

        .copy-code:active {
            transform: scale(.95);
        }

        .copy-code.copied {
            background: rgba(111,92,231,.35);
            color: #fff;
        }

        .copy-code.failed {
            background: rgba(217,85,85,.25);
            color: #fff;
        }

        .code {
            display: block;

            width: 100%;

            margin: 0;

            padding: 14px;

            overflow-x: auto;

            background: #25231f;
            color: #eeeae2;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 12px;
            line-height: 1.55;

            white-space: pre;
            tab-size: 4;

            text-align: left;
        }

        .code::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .code::-webkit-scrollbar-track {
            background: transparent;
        }

        .code::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.13);
            border-radius: 20px;
        }

        .inline-code {
            display: inline;

            padding: 2px 5px;

            border-radius: 5px;

            background: rgba(80,70,60,.08);

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: .9em;
        }

        /* =========================
           MESSAGE CONTENT FIX
        ========================= */

        .message-bubble strong {
            font-weight: 750;
        }

        .message-bubble .code-wrapper {
            line-height: normal;
        }

        .message-bubble > .code-wrapper:first-child {
            margin-top: 2px;
        }

        .message-bubble > .code-wrapper:last-child {
            margin-bottom: 2px;
        }

        /* =========================
           IMAGE
        ========================= */

        .message-image {
            display: block;

            width: auto;
            max-width: min(420px, 100%);
            max-height: 420px;

            margin-top: 9px;

            border-radius: 14px;

            border: 1px solid rgba(55,48,39,.08);

            object-fit: contain;

            background: rgba(255,255,255,.4);
        }

        .message-meta {
            margin-top: 5px;

            font-size: 10px;
            color: var(--muted);
        }

        .message.user .message-meta {
            text-align: right;
        }

        /* =========================
           IMAGE PREVIEW
        ========================= */

        .attachment {
            display: none;

            position: fixed;

            left: calc(
                var(--sidebar) + 20px
            );

            right: 20px;
            bottom: 92px;

            max-width: 760px;

            margin: 0 auto;

            z-index: 15;
        }

        .attachment.show {
            display: block;
        }

        .attachment-inner {
            display: flex;
            align-items: center;
            gap: 10px;

            width: fit-content;
            max-width: 100%;

            padding: 8px;

            border-radius: 15px;

            background: rgba(255,255,255,.76);
            border: 1px solid var(--border-light);

            box-shadow:
                0 10px 30px rgba(55,48,39,.12);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .attachment-image {
            width: 52px;
            height: 52px;

            object-fit: cover;

            border-radius: 10px;
        }

        .attachment-info {
            min-width: 0;
            max-width: 220px;
        }

        .attachment-name {
            font-size: 12px;
            font-weight: 650;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attachment-mode {
            margin-top: 3px;

            font-size: 10px;
            color: var(--muted);
        }

        .attachment-remove {
            width: 30px;
            height: 30px;

            border-radius: 9px;

            background: rgba(217,85,85,.09);
            color: var(--danger);

            font-size: 17px;
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                14px
                max(18px, 4vw)
                calc(14px + env(safe-area-inset-bottom));

            pointer-events: none;
        }

        .composer {
            width: min(820px, 100%);
            margin: 0 auto;

            display: flex;
            align-items: flex-end;
            gap: 8px;

            padding: 8px;

            border-radius: 18px;

            background: rgba(255,255,255,.74);
            border: 1px solid var(--border-light);

            box-shadow:
                0 10px 35px rgba(55,48,39,.11);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            pointer-events: auto;
        }

        .composer-button {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: rgba(245,241,234,.8);
            border: 1px solid rgba(55,48,39,.07);

            color: var(--text-soft);

            font-size: 18px;

            transition:
                background .15s ease,
                color .15s ease;
        }

        .composer-button:hover {
            background: #fff;
            color: var(--accent);
        }

        .composer-button.active {
            background: rgba(111,92,231,.12);
            color: var(--accent);
        }

        .composer-center {
            min-width: 0;
            flex: 1;
        }

        .mode-row {
            display: none;

            gap: 6px;

            margin: 0 0 6px;
        }

        .mode-row.show {
            display: flex;
        }

        .mode-button {
            padding: 5px 9px;

            border-radius: 8px;

            background: rgba(80,70,60,.06);
            color: var(--text-soft);

            font-size: 10px;
            font-weight: 650;
        }

        .mode-button.active {
            background: rgba(111,92,231,.12);
            color: var(--accent);
        }

        textarea {
            width: 100%;

            min-height: 40px;
            max-height: 140px;

            resize: none;

            border: 0;
            outline: 0;

            background: transparent;

            color: var(--text);

            padding: 9px 3px;

            font-size: 14px;
            line-height: 1.45;
        }

        textarea::placeholder {
            color: #9a948a;
        }

        .send-button {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: var(--accent);
            color: #fff;

            font-size: 16px;

            transition:
                background .15s ease,
                transform .15s ease;
        }

        .send-button:hover {
            background: var(--accent-dark);
        }

        .send-button:active {
            transform: scale(.95);
        }

        .send-button:disabled {
            opacity: .45;
            cursor: default;
        }

        .composer-hint {
            width: min(820px, 100%);
            margin: 7px auto 0;

            text-align: center;

            font-size: 9px;
            color: rgba(98,94,86,.7);

            pointer-events: auto;
        }

        #fileInput {
            display: none;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: none;

            max-width: 820px;
            margin: 0 auto 18px;

            align-items: center;
            gap: 9px;
        }

        .typing.show {
            display: flex;
        }

        .typing-avatar {
            width: 30px;
            height: 30px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background: rgba(255,255,255,.68);
            border: 1px solid var(--border-light);

            color: var(--accent);

            font-size: 10px;
            font-weight: 800;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #8d877d;

            animation:
                typing 1s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: .12s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: .24s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-3px);
                opacity: 1;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 720px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;

                transform: translateX(-100%);

                transition:
                    transform .18s ease;

                background: rgba(250,247,241,.92);

                box-shadow:
                    8px 0 30px rgba(40,35,30,.08);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: grid;
                place-items: center;

                width: 36px;
                height: 36px;

                border-radius: 10px;

                background: rgba(255,255,255,.56);
                border: 1px solid var(--border);

                color: var(--text-soft);
            }

            .topbar {
                height: 58px;
                padding: 0 12px;
            }

            .chat-container {
                padding:
                    22px
                    13px
                    165px;
            }

            .welcome {
                margin-top: 7vh;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .suggestions {
                grid-template-columns: 1fr;
                margin-top: 24px;
            }

            .message-content {
                max-width: 91%;
            }

            .attachment {
                left: 12px;
                right: 12px;
                bottom: 91px;
            }

            .composer-area {
                padding:
                    10px
                    10px
                    calc(
                        10px +
                        env(safe-area-inset-bottom)
                    );
            }

            .composer {
                border-radius: 16px;
            }

            .composer-hint {
                display: none;
            }

            .code-wrapper {
                margin: 11px 0;
                border-radius: 11px;
            }

            .code-header {
                min-height: 34px;
                padding-left: 10px;
            }

            .code {
                font-size: 11px;
                padding: 12px;
            }

            .copy-code {
                min-width: 50px;
                min-height: 26px;
                padding: 0 8px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-logo">P</div>

            <div class="brand-text">
                <div class="brand-title">
                    Pingu
                </div>

                <div class="brand-subtitle">
                    AI Assistant
                </div>
            </div>
        </div>

        <button
            class="new-chat"
            id="newChatButton"
            type="button"
        >
            <span>＋</span>
            <span>New chat</span>
        </button>

        <div class="history-title">
            Riwayat
        </div>

        <div
            class="history"
            id="history"
        ></div>

        <div class="sidebar-footer">
            <div class="status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                    aria-label="Menu"
                >
                    ☰
                </button>

                <div>
                    <div class="top-title">
                        Pingu

<script>
(() => {
    "use strict";

    const STORAGE_KEY =
        "pingu_ai_chats_v2";

    const elements = {
        sidebar:
            document.getElementById("sidebar"),

        mobileMenu:
            document.getElementById("mobileMenu"),

        newChatButton:
            document.getElementById("newChatButton"),

        history:
            document.getElementById("history"),

        welcome:
            document.getElementById("welcome"),

        messages:
            document.getElementById("messages"),

        chatContainer:
            document.getElementById("chatContainer"),

        typing:
            document.getElementById("typing"),

        composer:
            document.getElementById("composer"),

        messageInput:
            document.getElementById("messageInput"),

        sendButton:
            document.getElementById("sendButton"),

        imageButton:
            document.getElementById("imageButton"),

        fileInput:
            document.getElementById("fileInput"),

        attachment:
            document.getElementById("attachment"),

        attachmentImage:
            document.getElementById("attachmentImage"),

        attachmentName:
            document.getElementById("attachmentName"),

        attachmentMode:
            document.getElementById("attachmentMode"),

        removeAttachment:
            document.getElementById("removeAttachment"),

        modeRow:
            document.getElementById("modeRow"),

        chatMode:
            document.getElementById("chatMode"),

        imageMode:
            document.getElementById("imageMode"),

        modelLabel:
            document.getElementById("modelLabel")
    };

    let chats = [];
    let currentChatId = null;

    let attachedImage = null;
    let attachedImagePreview = null;

    let currentMode = "chat";
    let isSending = false;

    /* =========================
       STORAGE
    ========================= */

    function loadChats() {
        try {
            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (!saved) {
                chats = [];
                return;
            }

            const parsed =
                JSON.parse(saved);

            chats =
                Array.isArray(parsed)
                    ? parsed
                    : [];
        } catch {
            chats = [];
        }
    }

    function saveChats() {
        try {
            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(chats)
            );
        } catch (error) {
            console.warn(
                "Tidak dapat menyimpan history:",
                error
            );
        }
    }

    function createChat() {
        const chat = {
            id:
                Date.now().toString(36) +
                Math.random()
                    .toString(36)
                    .slice(2),

            title: "Chat baru",

            messages: [],

            createdAt:
                Date.now(),

            updatedAt:
                Date.now()
        };

        chats.unshift(chat);

        currentChatId =
            chat.id;

        saveChats();

        renderHistory();
        renderMessages();

        return chat;
    }

    function getCurrentChat() {
        return chats.find(
            (chat) =>
                chat.id ===
                currentChatId
        );
    }

    function ensureChat() {
        let chat =
            getCurrentChat();

        if (!chat) {
            chat = createChat();
        }

        return chat;
    }

    /* =========================
       HISTORY
    ========================= */

    function renderHistory() {
        elements.history.innerHTML = "";

        if (!chats.length) {
            elements.history.innerHTML = `
                <div class="history-empty">
                    Belum ada percakapan.
                </div>
            `;

            return;
        }

        for (const chat of chats) {
            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "history-item" +
                (
                    chat.id ===
                    currentChatId
                        ? " active"
                        : ""
                );

            button.textContent =
                chat.title ||
                "Chat baru";

            button.addEventListener(
                "click",
                () => {
                    currentChatId =
                        chat.id;

                    renderHistory();
                    renderMessages();

                    elements.sidebar
                        .classList
                        .remove("open");
                }
            );

            elements.history.appendChild(
                button
            );
        }
    }

    /* =========================
       MARKDOWN / CODE
    ========================= */

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatText(text) {
        const source =
            String(text ?? "");

        const codeBlocks = [];

        /*
         * Cari semua fenced code block:
         *
         * ```js
         * console.log("Hello");
         * ```
         *
         * atau:
         *
         * ```
         * kode
         * ```
         */
        const codePattern =
            /```[ \t]*([a-zA-Z0-9_+#.-]*)[ \t]*\r?\n([\s\S]*?)```/g;

        let lastIndex = 0;
        let output = "";

        let match;

        while (
            (match =
                codePattern.exec(source)) !== null
        ) {
            /*
             * Teks sebelum code block.
             */
            const normalText =
                source.slice(
                    lastIndex,
                    match.index
                );

            output +=
                formatNormalText(
                    normalText
                );

            const language =
                String(
                    match[1] || ""
                ).trim() || "code";

            const code =
                String(
                    match[2] || ""
                ).replace(
                    /\r?\n$/,
                    ""
                );

            const index =
                codeBlocks.length;

            codeBlocks.push({
                language,
                code
            });

            /*
             * Placeholder sengaja dibuat
             * sebelum HTML code block.
             */
            output +=
                `__PINGU_CODE_BLOCK_${index}__`;

            lastIndex =
                codePattern.lastIndex;
        }

        /*
         * Sisa teks setelah code block terakhir.
         */
        output +=
            formatNormalText(
                source.slice(lastIndex)
            );

        /*
         * Sekarang baru masukkan code block.
         *
         * Penting:
         * newline di dalam script TIDAK
         * boleh diubah menjadi <br>.
         */
        for (
            let i = 0;
            i < codeBlocks.length;
            i++
        ) {
            const block =
                codeBlocks[i];

            const safeLanguage =
                escapeHTML(
                    block.language
                );

            const safeCode =
                escapeHTML(
                    block.code
                );

            const codeHTML = `
                <div class="code-wrapper">
                    <div class="code-header">
                        <span class="code-language">${safeLanguage}</span>

                        <button
                            class="copy-code"
                            type="button"
                            data-code-index="${i}"
                            aria-label="Salin kode"
                            title="Salin kode"
                        >
                            Salin
                        </button>
                    </div>

                    <pre class="code"><code>${safeCode}</code></pre>
                </div>
            `;

            output =
                output.replace(
                    `__PINGU_CODE_BLOCK_${i}__`,
                    codeHTML
                );
        }

        return output;
    }

    function formatNormalText(text) {
        if (!text) {
            return "";
        }

        let output =
            escapeHTML(text);

        /*
         * Inline code.
         */
        output =
            output.replace(
                /`([^`\n]+)`/g,
                '<span class="inline-code">$1</span>'
            );

        /*
         * Bold.
         */
        output =
            output.replace(
                /\*\*([^*\n]+)\*\*/g,
                "<strong>$1</strong>"
            );

        /*
         * Newline hanya diterapkan ke
         * teks biasa, bukan code block.
         */
        output =
            output.replace(
                /\r?\n/g,
                "<br>"
            );

        return output;
    }

    /* =========================
       COPY CODE
    ========================= */

    async function copyCode(button) {
        if (!button) {
            return;
        }

        const wrapper =
            button.closest(
                ".code-wrapper"
            );

        if (!wrapper) {
            return;
        }

        const codeElement =
            wrapper.querySelector(
                "code"
            );

        if (!codeElement) {
            return;
        }

        /*
         * textContent mengambil kode asli,
         * bukan teks "Salin".
         */
        const code =
            codeElement.textContent || "";

        try {
            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {
                await navigator.clipboard.writeText(
                    code
                );
            } else {
                const textarea =
                    document.createElement(
                        "textarea"
                    );

                textarea.value =
                    code;

                textarea.setAttribute(
                    "readonly",
                    ""
                );

                textarea.style.position =
                    "fixed";

                textarea.style.left =
                    "-9999px";

                textarea.style.top =
                    "0";

                textarea.style.opacity =
                    "0";

                document.body.appendChild(
                    textarea
                );

                textarea.focus();
                textarea.select();
                textarea.setSelectionRange(
                    0,
                    textarea.value.length
                );

                const success =
                    document.execCommand(
                        "copy"
                    );

                textarea.remove();

                if (!success) {
                    throw new Error(
                        "Clipboard tidak tersedia."
                    );
                }
            }

            button.textContent =
                "Tersalin";

            button.classList.add(
                "copied"
            );

            button.classList.remove(
                "failed"
            );

            clearTimeout(
                button._copyTimer
            );

            button._copyTimer =
                setTimeout(() => {
                    button.textContent =
                        "Salin";

                    button.classList.remove(
                        "copied"
                    );
                }, 1600);

        } catch (error) {
            console.error(
                "Gagal menyalin kode:",
                error
            );

            button.textContent =
                "Gagal";

            button.classList.add(
                "failed"
            );

            button.classList.remove(
                "copied"
            );

            clearTimeout(
                button._copyTimer
            );

            button._copyTimer =
                setTimeout(() => {
                    button.textContent =
                        "Salin";

                    button.classList.remove(
                        "failed"
                    );
                }, 1600);
        }
    }

    /*
     * Tombol dibuat setelah AI menjawab,
     * jadi pakai event delegation.
     */
    document.addEventListener(
        "click",
        (event) => {
            const button =
                event.target.closest(
                    ".copy-code"
                );

            if (!button) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            copyCode(button);
        }
    );

    /* =========================
       RENDER MESSAGES
    ========================= */

    function renderMessages() {
        const chat =
            getCurrentChat();

        elements.messages.innerHTML = "";

        if (
            !chat ||
            !chat.messages.length
        ) {
            elements.welcome.style.display =
                "block";

            return;
        }

        elements.welcome.style.display =
            "none";

        for (
            const message of chat.messages
        ) {
            renderMessage(
                message,
                false
            );
        }

        scrollBottom();
    }

    function renderMessage(
        message,
        scroll = true
    ) {
        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "message " +
            (
                message.role ===
                "user"
                    ? "user"
                    : "assistant"
            );

        const avatar =
            document.createElement(
                "div"
            );

        avatar.className =
            "message-avatar";

        avatar.textContent =
            message.role ===
            "user"
                ? ""
                : "P";

        const content =
            document.createElement(
                "div"
            );

        content.className =
            "message-content";

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "message-bubble";

        bubble.innerHTML =
            formatText(
                message.content ||
                ""
            );

        content.appendChild(
            bubble
        );

        if (message.image) {
            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "message-image";

            image.src =
                `data:${message.image.mimeType};base64,${message.image.data}`;

            image.alt =
                "Gambar";

            image.loading =
                "lazy";

            content.appendChild(
                image
            );
        }

        const meta =
            document.createElement(
                "div"
            );

        meta.className =
            "message-meta";

        meta.textContent =
            message.model
                ? message.model
                : "";

        content.appendChild(
            meta
        );

        if (
            message.role ===
            "assistant"
        ) {
            wrapper.appendChild(
                avatar
            );
        }

        wrapper.appendChild(
            content
        );

        elements.messages.appendChild(
            wrapper
        );

        if (scroll) {
            scrollBottom();
        }
    }

    function scrollBottom() {
        requestAnimationFrame(() => {
            elements.chatContainer.scrollTop =
                elements.chatContainer.scrollHeight;
        });
    }

    /* =========================
       IMAGE
    ========================= */

    function resetAttachment() {
        if (attachedImagePreview) {
            URL.revokeObjectURL(
                attachedImagePreview
            );
        }

        attachedImage = null;
        attachedImagePreview = null;

        elements.fileInput.value = "";

        elements.attachment
            .classList
            .remove("show");

        elements.attachmentImage.src =
            "";

        elements.imageButton
            .classList
            .remove("active");

        elements.modeRow
            .classList
            .remove("show");

        setMode("chat");
    }

    function fileToBase64(file) {
        return new Promise(
            (resolve, reject) => {
                const reader =
                    new FileReader();

                reader.onload = () => {
                    const result =
                        String(
                            reader.result ||
                            ""
                        );

                    const comma =
                        result.indexOf(",");

                    resolve(
                        comma === -1
                            ? result
                            : result.slice(
                                comma + 1
                            )
                    );
                };

                reader.onerror =
                    reject;

                reader.readAsDataURL(
                    file
                );
            }
        );
    }

    async function handleImage(
        file
    ) {
        if (!file) {
            return;
        }

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {
            alert(
                "File yang dipilih bukan gambar."
            );

            return;
        }

        const maxSize =
            15 * 1024 * 1024;

        if (
            file.size >
            maxSize
        ) {
            alert(
                "Ukuran gambar terlalu besar. Maksimal 15 MB."
            );

            return;
        }

        try {
            const base64 =
                await fileToBase64(
                    file
                );

            if (attachedImagePreview) {
                URL.revokeObjectURL(
                    attachedImagePreview
                );
            }

            attachedImage = {
                mimeType:
                    file.type,

                data:
                    base64,

                name:
                    file.name,

                size:
                    file.size
            };

            attachedImagePreview =
                URL.createObjectURL(
                    file
                );

            elements.attachmentImage.src =
                attachedImagePreview;

            elements.attachmentName.textContent =
                file.name;

            elements.attachment
                .classList
                .add("show");

            elements.imageButton
                .classList
                .add("active");

            elements.modeRow
                .classList
                .add("show");

            setMode("chat");

            updateAttachmentLabel();

        } catch {
            alert(
                "Gagal membaca gambar."
            );
        }
    }

    function updateAttachmentLabel() {
        elements.attachmentMode.textContent =
            currentMode === "image"
                ? "Mode Edit / Buat Gambar"
                : "Mode Analisis Gambar";
    }

    /* =========================
       MODE
    ========================= */

    function setMode(mode) {
        currentMode =
            mode === "image"
                ? "image"
                : "chat";

        elements.chatMode
            .classList.toggle(
                "active",
                currentMode === "chat"
            );

        elements.imageMode
            .classList.toggle(
                "active",
                currentMode === "image"
            );

        updateAttachmentLabel();

        if (
            currentMode === "image"
        ) {
            elements.messageInput.placeholder =
                attachedImage
                    ? "Contoh: ubah background menjadi sunset..."
                    : "Contoh: buat gambar kota futuristik...";
        } else {
            elements.messageInput.placeholder =
                "Tulis pesan...";
        }
    }

    /* =========================
       SEND
    ========================= */

    async function sendMessage() {
        if (isSending) {
            return;
        }

        const text =
            elements.messageInput.value.trim();

        if (!text && !attachedImage) {
            return;
        }

        const chat =
            ensureChat();

        const userMessage = {
            role: "user",

            content:
                text ||
                (
                    currentMode === "image"
                        ? "Buat gambar berdasarkan gambar yang saya kirim."
                        : "Jelaskan gambar ini."
                ),

            time: Date.now()
        };

        if (attachedImage) {
            userMessage.image = {
                mimeType:
                    attachedImage.mimeType,

                data:
                    attachedImage.data
            };
        }

        chat.messages.push(
            userMessage
        );

        if (
            chat.title ===
            "Chat baru"
        ) {
            chat.title =
                text
                    ? text.slice(0, 42)
                    : "Percakapan gambar";
        }

        chat.updatedAt =
            Date.now();

        saveChats();

        elements.welcome.style.display =
            "none";

        renderMessage(
            userMessage
        );

        const requestImage =
            attachedImage
                ? {
                    mimeType:
                        attachedImage.mimeType,

                    data:
                        attachedImage.data
                }
                : null;

        const requestMode =
            currentMode;

        elements.messageInput.value =
            "";

        autoResize();

        resetAttachment();

        setSending(true);

        try {
            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                messages:
                                    chat.messages.map(
                                        (item) => ({
                                            role:
                                                item.role,

                                            content:
                                                item.content
                                        })
                                    ),

                                image:
                                    requestImage,

                                mode:
                                    requestMode
                            })
                    }
                );

            const raw =
                await response.text();

            let data;

            try {
                data =
                    JSON.parse(raw);
            } catch {
                throw new Error(
                    raw ||
                    `HTTP ${response.status}`
                );
            }

            if (
                !response.ok
            ) {
                throw new Error(
                    data?.error ||
                    `HTTP ${response.status}`
                );
            }

            const assistantMessage = {
                role: "assistant",

                content:
                    data.reply ||
                    "Tidak ada jawaban.",

                model:
                    data.model ||
                    "",

                time:
                    Date.now()
            };

            if (
                data.image &&
                data.image.data
            ) {
                assistantMessage.image =
                    {
                        mimeType:
                            data.image.mimeType ||
                            "image/png",

                        data:
                            data.image.data
                    };
            }

            chat.messages.push(
                assistantMessage
            );

            chat.updatedAt =
                Date.now();

            saveChats();

            renderMessage(
                assistantMessage
            );

            if (
                data.model
            ) {
                elements.modelLabel.textContent =
                    data.model;
            }

            renderHistory();

        } catch (error) {
            const errorMessage = {
                role: "assistant",

                content:
                    `Terjadi kesalahan:\n${error.message}`,

                time:
                    Date.now()
            };

            chat.messages.push(
                errorMessage
            );

            saveChats();

            renderMessage(
                errorMessage
            );

        } finally {
            setSending(false);
        }
    }

    function setSending(
        sending
    ) {
        isSending =
            sending;

        elements.sendButton.disabled =
            sending;

        elements.typing
            .classList.toggle(
                "show",
                sending
            );

        if (sending) {
            scrollBottom();
        }
    }

    /* =========================
       TEXTAREA
    ========================= */

    function autoResize() {
        const textarea =
            elements.messageInput;

        textarea.style.height =
            "auto";

        textarea.style.height =
            Math.min(
                textarea.scrollHeight,
                140
            ) + "px";
    }

    /* =========================
       EVENTS
    ========================= */

    elements.composer.addEventListener(
        "submit",
        (event) => {
            event.preventDefault();
            sendMessage();
        }
    );

    elements.messageInput.addEventListener(
        "input",
        autoResize
    );

    elements.messageInput.addEventListener(
        "keydown",
        (event) => {
            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {
                event.preventDefault();

                sendMessage();
            }
        }
    );

    elements.imageButton.addEventListener(
        "click",
        () => {
            elements.fileInput.click();
        }
    );

    elements.fileInput.addEventListener(
        "change",
        () => {
            const file =
                elements.fileInput.files?.[0];

            if (file) {
                handleImage(file);
            }
        }
    );

    elements.removeAttachment.addEventListener(
        "click",
        resetAttachment
    );

    elements.chatMode.addEventListener(
        "click",
        () => {
            setMode("chat");
        }
    );

    elements.imageMode.addEventListener(
        "click",
        () => {
            setMode("image");
        }
    );

    elements.newChatButton.addEventListener(
        "click",
        () => {
            createChat();

            elements.messageInput.focus();

            elements.sidebar
                .classList
                .remove("open");
        }
    );

    elements.mobileMenu.addEventListener(
        "click",
        () => {
            elements.sidebar
                .classList
                .toggle("open");
        }
    );

    document
        .querySelectorAll(
            ".suggestion"
        )
        .forEach((button) => {
            button.addEventListener(
                "click",
                () => {
                    elements.messageInput.value =
                        button.dataset.prompt ||
                        "";

                    autoResize();

                    elements.messageInput
                        .focus();
                }
            );
        });

    /* =========================
       INIT
    ========================= */

    loadChats();

    if (!chats.length) {
        createChat();
    } else {
        currentChatId =
            chats[0].id;

        renderHistory();
        renderMessages();
    }

    setMode("chat");

    autoResize();

})();
</script>

</body>
</html>
